services:
  - type: web
    name: smp-afterschool-management
    env: python
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python app.py"
    envVars:
      - key: SMP_DATA_DIR
        value: /var/data
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_REQUIRE_AUTH
        value: "1"
      - key: SUPABASE_PROJECT_REF
        value: ccftzopeneykbcwkwizq
      - key: SMP_ORGANIZATION_ID
        sync: false
    disk:
      name: smp-data
      mountPath: /var/data
      sizeGB: 1
