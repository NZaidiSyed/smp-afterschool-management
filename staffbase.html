<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>StaffBase — Greenfield Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.10.0/dist/tabler-icons.min.css">
<style>
/* ═══ DESIGN TOKENS ═════════════════════════════════════════════════════════ */
:root {
  --navy:   #0c1e35; --navy-1: #122540; --navy-2: #1a3454; --navy-3: #24466e;
  --gold:   #e08820; --gold-1: #f5a535; --gold-pale: #fef5e7; --gold-lt: #fde8bc;
  --green:  #0a8c6a; --green-lt: #dcf5ee; --green-dk: #065c46;
  --red:    #c42b1c; --red-lt: #fde8e6;
  --blue:   #1a65d4; --blue-lt: #e6effe;
  --amber:  #c97d10; --amber-lt: #fef3dc;
  --purple: #5b3fc4; --purple-lt: #eeeafe;
  --teal:   #0a7c9e; --teal-lt: #e0f4fa;
  --bg:     #f3f5f8; --sfc: #ffffff; --sfc-2: #f8fafb;
  --bdr:    #e3e8ef; --bdr-2: #c8d3e0;
  --tx:     #0c1e35; --tx-2: #4a5e78; --tx-3: #8fa5bc; --tx-4: #c2d0de;
  --font:   'Plus Jakarta Sans', sans-serif;
  --serif:  'Playfair Display', serif;
  --sh-sm:  0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --sh:     0 4px 12px rgba(0,0,0,.08), 0 2px 4px rgba(0,0,0,.04);
  --sh-lg:  0 16px 48px rgba(0,0,0,.14), 0 4px 12px rgba(0,0,0,.06);
  --r4:4px; --r8:8px; --r10:10px; --r12:12px; --r16:16px; --r20:20px; --r24:24px;
}
/* ═══ RESET ══════════════════════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--tx);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:var(--font);cursor:pointer;border:none;outline:none}
input,select,textarea{font-family:var(--font);font-size:13px;outline:none}
a{text-decoration:none;color:inherit}
img{display:block;max-width:100%}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bdr-2);border-radius:3px}
/* ═══ LAYOUT ═════════════════════════════════════════════════════════════════ */
.app-shell{display:flex;height:100vh;overflow:hidden;position:relative}
.sidebar{width:232px;min-width:232px;background:var(--navy);display:flex;flex-direction:column;overflow:hidden;z-index:10;transition:width .25s}
.sidebar-logo{padding:18px 16px 16px;border-bottom:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:10px;flex-shrink:0}
.logo-mark{width:38px;height:38px;border-radius:11px;background:rgba(224,136,32,.18);border:1.5px solid rgba(224,136,32,.45);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.logo-text{display:flex;flex-direction:column}
.logo-name{font-family:var(--serif);font-size:14px;color:#fff;line-height:1.2;letter-spacing:-.01em}
.logo-sub{font-size:10px;color:rgba(255,255,255,.35);margin-top:1px}
.sidebar-user{padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:10px;flex-shrink:0}
.user-info{flex:1;min-width:0}
.user-name{font-size:12px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar-nav{flex:1;overflow-y:auto;padding:8px 8px}
.nav-section{padding:10px 8px 4px;font-size:10px;font-weight:700;color:rgba(255,255,255,.25);letter-spacing:.08em;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border-radius:9px;border:1.5px solid transparent;background:transparent;color:rgba(255,255,255,.55);font-size:12.5px;font-weight:400;cursor:pointer;text-align:left;margin-bottom:2px;transition:all .15s;position:relative;white-space:nowrap;overflow:hidden}
.nav-item i{font-size:16px;width:18px;text-align:center;flex-shrink:0}
.nav-item:hover{background:rgba(255,255,255,.07);color:rgba(255,255,255,.85)}
.nav-item.active{background:rgba(224,136,32,.16);border-color:rgba(224,136,32,.35);color:#f5c97a;font-weight:600}
.nav-badge{position:absolute;right:10px;background:var(--red);color:#fff;font-size:9px;font-weight:700;padding:1px 5px;border-radius:10px;line-height:1.4}
.sidebar-footer{padding:10px 8px;border-top:1px solid rgba(255,255,255,.07);flex-shrink:0}
/* ═══ MAIN ════════════════════════════════════════════════════════════════════ */
.main-area{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{background:var(--sfc);border-bottom:1px solid var(--bdr);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;z-index:5;box-shadow:var(--sh-sm)}
.page-title{font-size:18px;font-weight:700;color:var(--tx);letter-spacing:-.01em}
.topbar-school{font-size:12px;font-weight:600;color:var(--tx-3);padding:3px 10px;background:var(--bg);border-radius:var(--r8);border:1px solid var(--bdr);letter-spacing:.01em;display:inline-flex;align-items:center;gap:5px}
.topbar-right{display:flex;align-items:center;gap:12px}
.live-clock{font-size:13px;font-weight:600;color:var(--tx-2);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.content-area{flex:1;overflow-y:auto;padding:22px 26px}
/* ═══ COMPONENTS ════════════════════════════════════════════════════════════ */
/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--r8);font-size:13px;font-weight:500;cursor:pointer;border:1.5px solid var(--bdr-2);background:var(--sfc);color:var(--tx);transition:all .15s;white-space:nowrap}
.btn:hover{background:var(--bg);border-color:var(--bdr-2)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn-primary:hover{background:var(--navy-2)}
.btn-gold{background:var(--gold);border-color:var(--gold);color:#fff}
.btn-gold:hover{background:var(--gold-1)}
.btn-green{background:var(--green);border-color:var(--green);color:#fff}
.btn-green:hover{background:var(--green-dk)}
.btn-red{background:var(--red);border-color:var(--red);color:#fff}
.btn-red:hover{background:#a32215}
.btn-ghost{background:transparent;border-color:transparent;color:var(--tx-2)}
.btn-ghost:hover{background:var(--bg)}
.btn-sm{padding:5px 12px;font-size:12px;border-radius:var(--r8)}
.btn-lg{padding:12px 24px;font-size:15px;border-radius:var(--r10)}
.btn-xl{padding:15px 28px;font-size:16px;border-radius:var(--r12);font-weight:600}
/* Badges */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:.02em}
.badge-green{background:var(--green-lt);color:var(--green-dk)}
.badge-red{background:var(--red-lt);color:#9a2215}
.badge-gold{background:var(--gold-lt);color:#7a4d08}
.badge-blue{background:var(--blue-lt);color:#144fb0}
.badge-purple{background:var(--purple-lt);color:#3e2a9a}
.badge-teal{background:var(--teal-lt);color:#065e7c}
.badge-gray{background:#f0f4f8;color:var(--tx-2)}
.badge-navy{background:#e4eaf2;color:var(--navy-2)}
/* Cards */
.card{background:var(--sfc);border:1px solid var(--bdr);border-radius:var(--r16);padding:18px 22px;box-shadow:var(--sh-sm)}
.card-sm{background:var(--sfc);border:1px solid var(--bdr);border-radius:var(--r12);padding:14px 18px;box-shadow:var(--sh-sm)}
/* Grid */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
/* Metric */
.metric{background:var(--sfc);border:1px solid var(--bdr);border-radius:var(--r12);padding:16px 18px;box-shadow:var(--sh-sm)}
.metric-label{font-size:11px;font-weight:600;color:var(--tx-3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.metric-val{font-size:28px;font-weight:700;line-height:1}
.metric-sub{font-size:11px;color:var(--tx-3);margin-top:5px}
/* Form */
.fl{font-size:11px;font-weight:700;color:var(--tx-2);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:5px}
.fc{width:100%;padding:9px 11px;border:1.5px solid var(--bdr-2);border-radius:var(--r8);font-size:13px;background:var(--sfc-2);color:var(--tx);transition:border-color .15s}
.fc:focus{border-color:var(--navy);background:var(--sfc)}
.fg{margin-bottom:14px}
/* Table */
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:left;padding:10px 14px;font-size:10.5px;font-weight:700;color:var(--tx-3);border-bottom:1.5px solid var(--bdr);text-transform:uppercase;letter-spacing:.05em;background:var(--sfc-2);white-space:nowrap}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--bdr);color:var(--tx);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr:hover td{background:#f7f9fc}
/* Avatar */
.av{border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex-shrink:0;font-size:11px;letter-spacing:.02em}
/* Toast */
.toast-wrap{position:fixed;top:18px;right:18px;z-index:99999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{padding:11px 18px;border-radius:var(--r10);font-size:13px;font-weight:500;color:#fff;box-shadow:var(--sh-lg);animation:toastIn .25s ease;pointer-events:all;display:flex;align-items:center;gap:8px;min-width:260px;max-width:360px}
@keyframes toastIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:translateX(0)}}
.toast-ok{background:var(--green)}
.toast-info{background:var(--blue)}
.toast-warn{background:var(--amber)}
.toast-err{background:var(--red)}
/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(12,30,53,.5);display:flex;align-items:center;justify-content:center;z-index:9000;padding:16px;backdrop-filter:blur(2px)}
.modal{background:var(--sfc);border-radius:var(--r20);box-shadow:var(--sh-lg);width:100%;animation:modalIn .2s ease}
@keyframes modalIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
.modal-hd{padding:20px 24px 16px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-size:16px;font-weight:700}
.modal-close{width:30px;height:30px;border-radius:var(--r8);border:1.5px solid var(--bdr);background:var(--sfc);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--tx-3);font-size:16px;transition:all .15s}
.modal-close:hover{background:var(--bg);border-color:var(--bdr-2)}
.modal-bd{padding:20px 24px}
.modal-ft{padding:14px 24px 20px;border-top:1px solid var(--bdr);display:flex;gap:8px}
/* Shift badge */
.shift-tag{display:inline-block;padding:3px 8px;border-radius:5px;font-size:10.5px;font-weight:600}
/* Progress bar */
.progress-wrap{height:7px;background:var(--bg);border-radius:4px;overflow:hidden;margin-top:6px}
.progress-fill{height:100%;border-radius:4px;transition:width .4s ease}
/* Section header */
.sec-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.sec-title{font-size:14px;font-weight:700;color:var(--tx)}
/* GPS indicator */
.gps-ring-outer{width:100px;height:100px;border-radius:50%;border:2px solid var(--green-lt);display:flex;align-items:center;justify-content:center;position:relative;margin:0 auto}
.gps-pulse{position:absolute;inset:-10px;border-radius:50%;border:2px solid rgba(10,140,106,.25);animation:gpsPulse 2s ease-out infinite}
.gps-pulse-2{position:absolute;inset:-22px;border-radius:50%;border:2px solid rgba(10,140,106,.12);animation:gpsPulse 2s ease-out infinite .4s}
@keyframes gpsPulse{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.3)}}
.gps-core{width:34px;height:34px;background:var(--green);border-radius:50%;display:flex;align-items:center;justify-content:center;border:3px solid #fff;box-shadow:var(--sh)}
/* Banner */
.banner{background:linear-gradient(130deg,var(--navy) 0%,var(--navy-2) 60%,var(--navy-3) 100%);border-radius:var(--r20);padding:24px 28px;margin-bottom:22px;position:relative;overflow:hidden}
.banner::after{content:'';position:absolute;top:-40px;right:-40px;width:200px;height:200px;border-radius:50%;background:rgba(224,136,32,.08);pointer-events:none}
/* Phone frame */
.phone-outer{background:var(--navy);border-radius:36px;padding:14px;box-shadow:var(--sh-lg);width:280px;flex-shrink:0}
.phone-screen{background:var(--bg);border-radius:24px;overflow:hidden;min-height:520px;display:flex;flex-direction:column}
.phone-notch{background:var(--navy);height:32px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.phone-notch-pill{width:70px;height:5px;background:rgba(255,255,255,.25);border-radius:3px}
.phone-header{padding:14px 16px;background:var(--navy);flex-shrink:0}
.phone-body{flex:1;overflow-y:auto;padding:14px;-webkit-overflow-scrolling:touch}
/* Schedule grid */
.sched-grid{display:grid;grid-template-columns:180px repeat(5,1fr);border-radius:var(--r12);overflow:hidden;border:1px solid var(--bdr)}
.sched-cell{padding:9px 8px;border-right:1px solid var(--bdr);border-bottom:1px solid var(--bdr);background:var(--sfc)}
.sched-cell:last-child{border-right:none}
.sched-head{background:var(--navy);color:rgba(255,255,255,.75);font-size:11px;font-weight:700;text-align:center;text-transform:uppercase;letter-spacing:.04em;padding:10px 8px;border-right:1px solid rgba(255,255,255,.08);border-bottom:1px solid rgba(255,255,255,.08)}
.sched-head:last-child{border-right:none}
.sched-emp{display:flex;align-items:center;gap:9px;padding:9px 12px;border-right:1px solid var(--bdr);border-bottom:1px solid var(--bdr);background:var(--sfc)}
/* Status dot */
.sdot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
/* Announcement card priority */
.ann-card{border-left:4px solid var(--gold);border-radius:0 var(--r12) var(--r12) 0}
.ann-card.high{border-left-color:var(--red)}
/* Tab bar */
.tab-bar{display:flex;border-bottom:2px solid var(--bdr);margin-bottom:20px}
.tab{padding:10px 16px;font-size:13px;font-weight:500;color:var(--tx-3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s}
.tab.active{color:var(--navy);border-bottom-color:var(--navy);font-weight:600}
.tab:hover:not(.active){color:var(--tx-2)}
/* Divider */
.divider{height:1px;background:var(--bdr);margin:14px 0}
/* ═══ LOGIN ══════════════════════════════════════════════════════════════════ */
#login-screen{position:fixed;inset:0;background:linear-gradient(140deg,#071424 0%,#0f2540 50%,#1a3558 100%);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px}
.login-card{width:100%;max-width:460px}
.login-panel{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:var(--r20);overflow:hidden;backdrop-filter:blur(16px)}
.login-tab-bar{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid rgba(255,255,255,.1)}
.login-tab{padding:14px;border:none;border-bottom:2px solid transparent;background:transparent;font-family:var(--font);font-size:13px;cursor:pointer;transition:all .2s;color:rgba(255,255,255,.4)}
.login-tab.active{color:#f5c97a;border-bottom-color:var(--gold);background:rgba(224,136,32,.1)}
.login-body{padding:26px}
.pin-display{font-size:34px;letter-spacing:14px;color:#fff;text-align:center;min-height:46px;margin:12px 0;font-weight:300}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;max-width:230px;margin:0 auto 14px}
.numpad-btn{padding:13px;border-radius:var(--r10);border:1.5px solid rgba(255,255,255,.14);background:rgba(255,255,255,.07);color:#fff;font-size:16px;font-weight:500;cursor:pointer;font-family:var(--font);transition:all .12s;text-align:center}
.numpad-btn:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.25)}
.numpad-btn:active{transform:scale(.94)}
.numpad-btn.clr{background:rgba(192,43,28,.25);border-color:rgba(192,43,28,.35)}
/* ═══ MOBILE APP SPECIFIC ════════════════════════════════════════════════════ */
.mob-emp-row{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;border-radius:var(--r10);border:1.5px solid var(--bdr);background:var(--sfc);margin-bottom:8px;cursor:pointer;transition:all .15s}
.mob-emp-row:hover{border-color:var(--bdr-2);background:var(--sfc-2)}
.mob-emp-row.selected{border-color:var(--navy);background:var(--blue-lt)}
.gps-status-box{border-radius:var(--r12);padding:16px;text-align:center;margin-top:14px}
.gps-status-box.success{background:var(--green-lt);border:1.5px solid rgba(10,140,106,.2)}
.gps-status-box.warning{background:var(--amber-lt);border:1.5px solid rgba(201,125,16,.2)}
.gps-status-box.error{background:var(--red-lt);border:1.5px solid rgba(196,43,28,.2)}
/* ═══ RESPONSIVE ═════════════════════════════════════════════════════════════ */
@media(max-width:768px){
  .sidebar{position:absolute;left:0;top:0;height:100%;z-index:50;transform:translateX(-100%);transition:transform .25s}
  .sidebar.open{transform:translateX(0)}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .content-area{padding:14px 16px}
}
</style>
</head>
<body>

<!-- TOAST CONTAINER -->
<div class="toast-wrap" id="toast-wrap"></div>

<!-- LOGIN SCREEN -->
<div id="login-screen">
  <div class="login-card">
    <div style="text-align:center;margin-bottom:28px">
      <div style="width:78px;height:78px;border-radius:22px;background:rgba(224,136,32,.15);border:2px solid rgba(224,136,32,.4);display:flex;align-items:center;justify-content:center;font-size:40px;margin:0 auto 16px">🏫</div>
      <div style="font-family:var(--serif);font-size:28px;color:#fff;letter-spacing:-.02em;margin-bottom:4px">Greenfield Academy</div>
      <div style="font-size:12px;color:rgba(255,255,255,.4)">Staff Scheduling & HR Management Portal</div>
    </div>
    <div class="login-panel">
      <div class="login-tab-bar">
        <button class="login-tab active" id="lt-staff" onclick="setLoginTab('staff')"><i class="ti ti-id-badge-2"></i> Staff (PIN)</button>
        <button class="login-tab" id="lt-admin" onclick="setLoginTab('admin')"><i class="ti ti-shield-lock"></i> Admin / Manager</button>
      </div>
      <div class="login-body">
        <!-- Staff PIN tab -->
        <div id="tab-staff-panel">
          <div class="fg">
            <label class="fl" style="color:rgba(255,255,255,.4)">Your name</label>
            <select class="fc" id="ln-sel" onchange="onEmpSelect()" style="background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.15);color:#fff">
              <option value="">— Select your name —</option>
            </select>
          </div>
          <div id="pin-section" style="display:none">
            <div id="selected-emp-info" style="display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.07);border-radius:var(--r10);padding:10px 13px;margin-bottom:16px"></div>
            <div style="font-size:12px;color:rgba(255,255,255,.5);text-align:center;margin-bottom:8px">Enter your 4-digit PIN</div>
            <div class="pin-display" id="pin-display">○○○○</div>
            <div class="numpad" id="numpad"></div>
            <div id="pin-err" style="color:#f87171;font-size:12px;text-align:center;min-height:18px;margin-bottom:8px"></div>
            <button class="btn-xl btn-gold" id="pin-btn" onclick="doStaffLogin()" disabled style="width:100%;justify-content:center">Sign In →</button>
          </div>
        </div>
        <!-- Admin tab -->
        <div id="tab-admin-panel" style="display:none">

async function syncToServer(endpoint, data) {
  if (!USE_API) return;
  try {
    await fetch(`${API_BASE}/${endpoint}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
  } catch (e) {
    console.error(`Sync error to /api/${endpoint}:`, e);
  }
}

async function applySystemMetadata() {
  const params = new URLSearchParams(window.location.search);
  const paramSchoolName = params.get('school_name');
  const paramSubjects = params.get('subjects');
  const paramWeekdays = params.get('weekdays');
  const paramOperatingStart = params.get('operating_start');
  const paramOperatingEnd = params.get('operating_end');

  let changed = false;

  if (paramSchoolName && paramSchoolName !== SCHOOL.name) {
    SCHOOL.name = paramSchoolName;
    changed = true;
  }

  if (paramOperatingStart && paramOperatingStart !== SCHOOL.operatingStart) {
    SCHOOL.operatingStart = paramOperatingStart;
    changed = true;
  }

  if (paramOperatingEnd && paramOperatingEnd !== SCHOOL.operatingEnd) {
    SCHOOL.operatingEnd = paramOperatingEnd;
    changed = true;
  }

  if (paramSubjects) {
    const newSubjects = paramSubjects.split(/[\n,]+/).map(s => s.trim()).filter(Boolean);
    if (newSubjects.length > 0) {
      const currentJSON = JSON.stringify(SUBJECTS);
      const newJSON = JSON.stringify(newSubjects);
      if (currentJSON !== newJSON) {
        SUBJECTS = newSubjects;
        localStorage.setItem('sb_subjects', JSON.stringify(SUBJECTS));
        if (USE_API) {
          await syncToServer('subjects', SUBJECTS);
        }
        changed = true;
      }
    }
  }

  if (paramWeekdays) {
    const newDays = paramWeekdays.split(',').map(d => d.trim()).filter(Boolean);
    if (newDays.length > 0) {
      const currentJSON = JSON.stringify(SCHOOL.openDays);
      const newJSON = JSON.stringify(newDays);
      if (currentJSON !== newJSON) {
        SCHOOL.openDays = newDays;
        DAYS = newDays;
        FULL_DAYS = DAYS.map(d => WEEKDAY_NAMES[d] || d);
        
        // Roster schedule safety sync
        if (typeof USERS !== 'undefined' && typeof SCHEDULE !== 'undefined') {
          USERS.forEach(u => {
            if (ROLES[u.role]) {
              if (!SCHEDULE.shifts[u.id]) SCHEDULE.shifts[u.id] = {};
              DAYS.forEach(d => {
                if (!SCHEDULE.shifts[u.id][d]) {
                  SCHEDULE.shifts[u.id][d] = { type: 'Off', start: null, end: null, location: 'Office', notes: '', ack: false };
                }
              });
            }
          });
          if (USE_API) {
            await syncToServer('schedule', SCHEDULE);
          } else {
            localStorage.setItem('sb_schedule', JSON.stringify(SCHEDULE));
          }
        }

        changed = true;
      }
    }
  }

  if (changed) {
    localStorage.setItem('sb_school', JSON.stringify(SCHOOL));
    if (USE_API) {
      await syncToServer('school', SCHOOL);
    }
  }
}

async function probeServerAndLoadData() {

  try {

      setLoginTab('staff');
    }
  } catch (e) {
    console.warn("Could not check main app config, fallback to default tabs:", e);
  }

  try {
    const res = await fetch(`${API_BASE}/health`);
    if (!res.ok) throw new Error(`Health check returned ${res.status}`);
    const health = await res.json();
    if (health.status === 'ok') {
      console.log("Enterprise Database Connected ✓");
      const dataRes = await fetch(`${API_BASE}/data`);
      if (!dataRes.ok) throw new Error(`Data fetch returned ${dataRes.status}`);
      const data = await dataRes.json();
      if (!data || !data.school || !data.users) throw new Error("Invalid database payload");
      
      SCHOOL = data.school;
      USERS = data.users;
      SUBJECTS = data.subjects;
      SCHEDULE = data.schedule;
      REQUESTS = data.requests;
      ANNOUNCEMENTS = data.announcements;
      MESSAGES = data.messages;
      CLOCK_DATA = data.clock_data;
      CHECKIN_LOG = data.checkin_log;
      
      DAYS = SCHOOL.openDays;
      FULL_DAYS = DAYS.map(d => WEEKDAY_NAMES[d]);
      USE_API = true;
    } else {
      throw new Error("Health status not ok");
    }
  } catch (e) {
    console.warn("Express server error or offline, running in offline LocalStorage sandbox mode:", e.message);
    USE_API = false;
    // Restore variables from localStorage or defaults
    SCHOOL = JSON.parse(localStorage.getItem('sb_school')) || DEFAULT_SCHOOL;
    if (!SCHOOL.openDays) SCHOOL.openDays = ['Tue','Wed','Thu','Fri','Sat'];
    USERS = JSON.parse(localStorage.getItem('sb_users')) || INITIAL_USERS;

    CLOCK_DATA = JSON.parse(localStorage.getItem('sb_clock_data')) || {};
    CHECKIN_LOG = JSON.parse(localStorage.getItem('sb_checkin_log')) || [];
    DAYS = SCHOOL.openDays || ['Tue','Wed','Thu','Fri','Sat'];
    FULL_DAYS = DAYS.map(d => WEEKDAY_NAMES[d]);
  }
  await applySystemMetadata();
  initSchoolName();
  renderConnectionBadge();
  if (typeof initLogin === 'function') initLogin();
  if (typeof checkAutoLogin === 'function') checkAutoLogin();
}

function getSubjectColor(dept) {
  const baseColors = {
    Mathematics: '#5b3fc4',
    Science: '#0a8c6a',
    English: '#1a65d4',
    History: '#c97d10',
    Arts: '#c42b1c',
    PE: '#0a7c9e',
    Administration: '#4a5e78',
    Support: '#7a5230',
  };
  if (baseColors[dept]) return baseColors[dept];
  let hash = 0;
  for (let i = 0; i < dept.length; i++) {
    hash = dept.charCodeAt(i) + ((hash << 5) - hash);
  }
  const hue = Math.abs(hash) % 360;
  return `hsl(${hue}, 65%, 48%)`;
}

function buildDefaultSchedule() {
  const patterns = {

    6: ['Planning','Teaching','Teaching','Teaching','Teaching'],

    10:['Teaching','Teaching','Planning','Meeting','Teaching'],
    3: ['Meeting','Teaching','Planning','Teaching','Supervision'],
  };
  const shifts = {};
  for (const uid in patterns) {
    shifts[uid] = {};
    DAYS.forEach((d, i) => {
      const type = patterns[uid][i % patterns[uid].length] || 'Off';
      const locs = { Teaching: `Room ${100 + parseInt(uid)}`, Meeting: 'Staff Room', Supervision: 'Main Hallway', Planning: 'Office', 'Prof Dev': 'Off-site' };

    });
  }
  return shifts;
}

const $ = id => document.getElementById(id);
const fmtTime = d => d.toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
function getShiftHours(sh) {
  if (!sh || sh.type === 'Off' || !sh.start || !sh.end) return 0;
  const [shour, smin] = sh.start.split(':').map(Number);
  const [ehour, emin] = sh.end.split(':').map(Number);
  const diffMinutes = (ehour * 60 + emin) - (shour * 60 + smin);
  return Math.max(0, parseFloat((diffMinutes / 60).toFixed(2)));
}
function formatShiftTime(start, end) {
  if (!start || !end) return '';
  const to12h = t => {
    let [h, m] = t.split(':');
    h = parseInt(h);
    const ampm = h >= 12 ? 'p' : 'a';
    h = h % 12 || 12;
    return `${h}:${m}${ampm}`;
  };
  return `${to12h(start)}–${to12h(end)}`;
}

const fmtTimeSec = d => d.toLocaleTimeString([], { hour:'2-digit', minute:'2-digit', second:'2-digit' });

function avBg(name) {
  const c = ['#0c1e35','#0a8c6a','#1a65d4','#5b3fc4','#c97d10','#c42b1c','#0a7c9e','#7a5230','#4a5e78'];
  let h = 0; for (const ch of name) h = (h * 31 + ch.charCodeAt(0)) % c.length;
  return c[h];
}
function mkAv(u, sz = 32) {
  return `<div class="av" style="width:${sz}px;height:${sz}px;min-width:${sz}px;background:${avBg(u.name)};font-size:${Math.round(sz * 0.33)}px">${u.av}</div>`;
}
function shiftTag(type, small) {
  const s = SHIFT_TYPES[type] || SHIFT_TYPES.Off;
  return `<span class="shift-tag" style="color:${s.color};background:${s.bg};font-size:${small?9.5:11}px;padding:${small?'2px 6px':'3px 9px'}">${s.label}</span>`;
}
function roleBadge(role) {
  const r = ROLES[role] || { label: role, badge: 'badge-gray' };
  return `<span class="badge ${r.badge}">${r.label}</span>`;
}
function statusBadge(status) {
  const m = { pending: ['badge-gold','Pending'], approved: ['badge-green','Approved'], denied: ['badge-red','Denied'] };
  const [cls, lbl] = m[status] || ['badge-gray', status];
  return `<span class="badge ${cls}">${lbl}</span>`;
}
function clockBadge(uid) {
  const cd = CLOCK_DATA[uid];
  if (!cd) return '<span class="badge badge-gray">Not in</span>';
  if (cd.status === 'in') return `<span class="badge badge-green">● Clocked In</span>`;
  return `<span class="badge badge-gray">Clocked Out</span>`;
}
function deptDot(dept) {
  return `<span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${getSubjectColor(dept)};margin-right:5px;flex-shrink:0"></span>`;
}

// GPS distance (Haversine)
function gpsDist(lat1, lng1, lat2, lng2) {
  const R = 6371000, toRad = x => x * Math.PI / 180;
  const dLat = toRad(lat2 - lat1), dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng/2)**2;
  return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
}

// ═══════════════════════════════════════════════════════════════════════════
// TOAST
// ═══════════════════════════════════════════════════════════════════════════
function toast(msg, type = 'ok') {
  const icons = { ok: 'ti-circle-check', info: 'ti-info-circle', warn: 'ti-alert-triangle', err: 'ti-circle-x' };
  const wrap = $('toast-wrap');
  const el = document.createElement('div');
  el.className = `toast toast-${type}`;
  el.innerHTML = `<i class="ti ${icons[type]||'ti-circle-check'}" style="font-size:18px;flex-shrink:0"></i>${msg}`;
  wrap.appendChild(el);
  setTimeout(() => { el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(() => el.remove(), 300); }, 3000);
}

function openModal(title, body, footer = '', width = 540) {
  let existing = $('modal-root');
  if (existing) existing.remove();
  const el = document.createElement('div');
  el.id = 'modal-root';
  el.className = 'modal-overlay';
  el.innerHTML = `
    <div class="modal" style="max-width:${width}px;max-height:88vh;overflow-y:auto">
      <div class="modal-hd">
        <div class="modal-title">${title}</div>
        <div class="modal-close" onclick="closeModal()"><i class="ti ti-x"></i></div>
      </div>
      <div class="modal-bd">${body}</div>
      ${footer ? `<div class="modal-ft">${footer}</div>` : ''}
    </div>`;
  el.addEventListener('click', e => { if (e.target === el) closeModal(); });
  document.body.appendChild(el);
}
function closeModal() { const m = $('modal-root'); if (m) m.remove(); }

// Build staff select + numpad
function initLogin() {
  const staffUsers = USERS.filter(u => u.role === 'staff' || u.role === 'office_assistant');
  const sel = $('ln-sel');
  if (!sel) return;
  sel.innerHTML = '<option value="">— Select your name —</option>';
  staffUsers.forEach(u => { const o = new Option(`${u.name} — ${u.pos}`, u.id); sel.appendChild(o); });

  const np = $('numpad');
  if (np) {
    np.innerHTML = '';
    ['1','2','3','4','5','6','7','8','9','CLR','0','⌫'].forEach(k => {
      const b = document.createElement('button');
      b.className = 'numpad-btn' + (k === 'CLR' ? ' clr' : '');
      b.textContent = k;
      b.addEventListener('click', () => handlePin(k));
      np.appendChild(b);
    });
  }
}

function setLoginTab(tab) {
  const isStaff = tab === 'staff';
  $('tab-staff-panel').style.display = isStaff ? '' : 'none';
  $('tab-admin-panel').style.display = isStaff ? 'none' : '';
  $('lt-staff').classList.toggle('active', isStaff);
  $('lt-admin').classList.toggle('active', !isStaff);
}

function onEmpSelect() {
  const uid = parseInt($('ln-sel').value);
  const u = USERS.find(x => x.id === uid);
  PIN_EMP_ID = uid || null;
  PIN_BUF = '';
  updatePinDisplay();
  $('pin-err').textContent = '';
  $('pin-section').style.display = u ? '' : 'none';
  if (u) {
    $('selected-emp-info').innerHTML = `
      ${mkAv(u, 38)}
      <div><div style="font-weight:600;font-size:13px;color:#fff">${u.name}</div>
      <div style="font-size:11px;color:rgba(255,255,255,.5)">${u.pos} · ${u.dept}</div></div>`;
  }
}

function handlePin(k) {
  if (k === 'CLR') PIN_BUF = '';
  else if (k === '⌫') PIN_BUF = PIN_BUF.slice(0, -1);
  else if (PIN_BUF.length < 4) PIN_BUF += k;
  updatePinDisplay();
  $('pin-err').textContent = '';
  $('pin-btn').disabled = PIN_BUF.length !== 4;
  if (PIN_BUF.length === 4) setTimeout(doStaffLogin, 120);
}

function updatePinDisplay() {
  $('pin-display').textContent = '●'.repeat(PIN_BUF.length) + '○'.repeat(4 - PIN_BUF.length);
}

function doStaffLogin() {
  const u = USERS.find(x => x.id === PIN_EMP_ID);
  if (!u) { $('pin-err').textContent = 'Please select your name first.'; return; }
  if (u.pin !== PIN_BUF) {
    $('pin-err').textContent = 'Incorrect PIN. Please try again.';
    PIN_BUF = ''; updatePinDisplay(); $('pin-btn').disabled = true; return;
  }
  launchApp(u);
}

function doAdminLogin() {
  const email = $('ln-email').value.trim();
  const pass  = $('ln-pass').value;
  $('admin-err').textContent = '';
  
  const u = USERS.find(x => x.email && x.email.toLowerCase() === email.toLowerCase());
  if (!u) {
    $('admin-err').textContent = 'Account with this email does not exist.';
    return;
  }
  if (u.role === 'staff' || u.role === 'office_assistant') {
    $('admin-err').textContent = 'Access Denied: Please use the PIN Pad tab to log in as Staff.';
    return;
  }
  
  const correctPass = u.password || 'school2026';
  if (pass !== correctPass) {
    $('admin-err').textContent = 'Incorrect password.';
    return;
  }
  
  launchApp(u);
}

function quickLogin(email) {
  const u = USERS.find(x => x.email && x.email.toLowerCase() === email.toLowerCase());
  $('ln-email').value = email;
  $('ln-pass').value = u ? (u.password || 'school2026') : 'school2026';
  doAdminLogin();
}
function staffQuickLogin(uid) {
  setLoginTab('staff');
  $('ln-sel').value = uid; onEmpSelect();
  setTimeout(() => { PIN_BUF = USERS.find(u=>u.id===uid)?.pin||''; updatePinDisplay(); doStaffLogin(); }, 100);
}

function launchApp(u) {
  CU = u;
  $('login-screen').style.display = 'none';
  $('app-shell').style.display = 'flex';
  initSchoolName();
  buildSidebar();
  renderConnectionBadge();
  navigate('dashboard');
  startClock();
}

function doLogout() {
  CU = null; PIN_BUF = ''; PIN_EMP_ID = null;
  ACTIVE_CHAT_UID = null;
  COMM_TAB = 'broadcast';
  $('app-shell').style.display = 'none';
  $('login-screen').style.display = 'flex';
  $('ln-email').value = ''; $('ln-pass').value = '';
  $('ln-sel').value = ''; onEmpSelect();
  window.parent.postMessage({ type: 'logout' }, '*');
}

function toggleMyPin(btn) {
  const el = $('my-pin-code');
  if (!el) return;
  if (el.textContent === '••••') {
    el.textContent = CU.pin;
    btn.innerHTML = '<i class="ti ti-eye-off"></i> Hide';
  } else {
    el.textContent = '••••';
    btn.innerHTML = '<i class="ti ti-eye"></i> Show';
  }
}

function navigate(pg) {
  if (pg === 'settings' && CU.role !== 'principal_owner' && CU.role !== 'administrator') {
    toast('Access Denied: You do not have permission to view Settings.', 'err');
    navigate('dashboard');
    return;
  }
  document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
  const nb = $(`nav-${pg}`); if (nb) nb.classList.add('active');

  const titles = {
    dashboard: 'Dashboard', schedule: isManager() ? 'Schedule Builder' : 'My Schedule',
    checkin: 'Mobile Check-In / Check-Out', timesheets: 'Timesheets',
    staff: 'Staff Management', requests: 'Time-Off Requests',
    announcements: 'Announcements', reports: 'Reports & Analytics', settings: 'Settings'
  };
  $('page-title').textContent = titles[pg] || pg;

  const topbarActions = {
    schedule: isManager() ? `<button class="btn btn-gold" onclick="publishSchedule()"><i class="ti ti-send"></i>${SCHEDULE.published ? 'Re-publish' : 'Publish Schedule'}</button>` : '',

  };
  $('topbar-actions').innerHTML = topbarActions[pg] || '';

  const pages = { dashboard: pgDashboard, schedule: pgSchedule, checkin: pgCheckin, timesheets: pgTimesheets, staff: pgStaff, requests: pgRequests, announcements: pgAnnouncements, reports: pgReports, settings: pgSettings };
  if (pages[pg]) pages[pg]();

function startClock() {
  const tick = () => { const el = $('live-clock'); if (el) el.textContent = fmtTimeSec(new Date()); };
  tick(); setInterval(tick, 1000);
}

// ═══════════════════════════════════════════════════════════════════════════
// CLOCK IN / OUT ENGINE
// ═══════════════════════════════════════════════════════════════════════════
function doClock(uid, type, gpsOK, lat, lng, dist) {
  const t = fmtTime(new Date());
  const dateStr = new Date().toLocaleDateString('en-CA', { month: 'short', day: 'numeric' });
  if (type === 'in') {
    CLOCK_DATA[uid] = { in: t, out: null, status: 'in', gpsOK, lat, lng, dist, date: dateStr };
  } else {
    CLOCK_DATA[uid] = { ...(CLOCK_DATA[uid] || {}), out: t, status: 'out', gpsOK, lat, lng, dist, date: dateStr };
  }
  CHECKIN_LOG.unshift({ uid, type, time: t, date: dateStr, gpsOK, lat, lng, dist });
  saveClockData();
  saveCheckinLog();
  const u = USERS.find(x => x.id === uid);
  const gpsLabel = gpsOK ? ' · GPS verified ✓' : ' · Location override';
  toast(`${u?.name} clocked ${type === 'in' ? 'IN' : 'OUT'} at ${t}${gpsLabel}`, gpsOK ? 'ok' : 'warn');
}

function ackShift(uid, day) {
  if (SCHEDULE.shifts[uid]?.[day]) SCHEDULE.shifts[uid][day].ack = true;
  pgSchedule(); toast('Shift acknowledged!', 'ok');
}

function publishSchedule() {
  SCHEDULE.published = true;
  SCHEDULE.publishedAt = new Date().toLocaleString('en-CA', { month:'short', day:'numeric', year:'numeric', hour:'2-digit', minute:'2-digit' });
  navigate('schedule'); toast('Schedule published! All staff have been notified.', 'ok');
}

function editShift(uid, day) {
  const sh = SCHEDULE.shifts[uid]?.[day] || {};
  const u = USERS.find(x => x.id === uid);
  openModal(`Edit Shift — ${u?.name} · ${FULL_DAYS[DAYS.indexOf(day)]}`, `
    <div class="fg"><label class="fl">Shift Type</label>
      <select class="fc" id="es-type">${Object.keys(SHIFT_TYPES).map(t=>`<option value="${t}" ${sh.type===t?'selected':''}>${SHIFT_TYPES[t].label}</option>`).join('')}</select>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div class="fg"><label class="fl">Start time</label><input class="fc" id="es-start" type="time" value="${sh.start||SCHOOL.operatingStart||'15:00'}"></div>
      <div class="fg"><label class="fl">End time</label><input class="fc" id="es-end" type="time" value="${sh.end||SCHOOL.operatingEnd||'20:00'}"></div>
    </div>
    <div class="fg"><label class="fl">Location / Room</label><input class="fc" id="es-loc" value="${sh.location||''}" placeholder="Room 101, Staff Room, Gymnasium…"></div>
    <div class="fg"><label class="fl">Notes (optional)</label><input class="fc" id="es-notes" value="${sh.notes||''}" placeholder="Any additional details…"></div>`,
    `<button class="btn btn-primary" onclick="saveEditShift(${uid},'${day}')"><i class="ti ti-device-floppy"></i> Save</button><button class="btn" onclick="closeModal()">Cancel</button>`);

  const setupModalListeners = () => {
    const sel = $('es-type');
    const startInput = $('es-start');
    const endInput = $('es-end');
    const locInput = $('es-loc');
    
    if (!sel || !startInput || !endInput) return;
    
    const updateStates = () => {
      const type = sel.value;
      if (type === 'Off') {
        startInput.value = '';
        endInput.value = '';
        startInput.disabled = true;
        endInput.disabled = true;
        if (!locInput.value || locInput.value === 'Office') {
          locInput.value = 'Off';
        }
        locInput.disabled = true;
      } else {
        startInput.disabled = false;
        endInput.disabled = false;
        locInput.disabled = false;
        if (!startInput.value) startInput.value = SCHOOL.operatingStart || '15:00';
        if (!endInput.value) endInput.value = SCHOOL.operatingEnd || '20:00';
        if (locInput.value === 'Off') locInput.value = '';
      }
    };
    
    sel.addEventListener('change', updateStates);
    updateStates(); // Initialize state
  };
  setTimeout(setupModalListeners, 50);
}
function saveEditShift(uid, day) {
  if (!SCHEDULE.shifts[uid]) SCHEDULE.shifts[uid] = {};
  const type = $('es-type').value;
  const start = $('es-start').value;
  const end = $('es-end').value;
  
  if (type !== 'Off' && (!start || !end)) {
    toast('Please enter both start and end times for manual entry.', 'warn');
    return;
  }
  
  SCHEDULE.shifts[uid][day] = { 
    type, 
    start: type === 'Off' ? null : start, 
    end: type === 'Off' ? null : end, 
    location: $('es-loc').value, 
    notes: $('es-notes').value, 
    ack: false 
  };
  saveSchedule();
  closeModal(); pgSchedule(); toast('Shift updated!', 'ok');
}

        const stat = cd?.status==='in' ? ['badge-green','Clocked In'] : cd?.status==='out' ? ['badge-gray','Done'] : ['badge-gold','Away'];
        return `<div class="mob-emp-row" onclick="mobSelectEmp(${s.id})">
          <div style="display:flex;align-items:center;gap:9px">${mkAv(s,36)}<div><div style="font-size:13px;font-weight:600">${s.name}</div><div style="font-size:11px;color:var(--tx-3)">${s.pos}</div></div></div>
          <span class="badge ${stat[0]}">${stat[1]}</span>
        </div>`;
      }).join('')}`;
  }

  else if (MOB.step === 'pin') {
    const u = USERS.find(x => x.id === MOB.empId);
    const actionLbl = MOB.action === 'in' ? 'Clock In' : 'Clock Out';
    pb.innerHTML = `
      <div style="display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:var(--r10);padding:10px 12px;margin-bottom:16px">
        ${mkAv(u,38)}<div><div style="font-size:13px;font-weight:700">${u?.name}</div><div style="font-size:11px;color:var(--tx-3)">${actionLbl} · ${u?.dept}</div></div>
      </div>
      <div style="text-align:center;margin-bottom:12px">
        <div style="font-size:11.5px;color:var(--tx-3);margin-bottom:8px">Enter your 4-digit PIN</div>
        <div id="mob-pin-dots" style="font-size:28px;letter-spacing:12px;min-height:40px;color:var(--navy)">○○○○</div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:220px;margin:0 auto 12px">
        ${['1','2','3','4','5','6','7','8','9','CLR','0','⌫'].map(k=>`<button class="numpad-btn${k==='CLR'?' clr':''}" style="padding:10px;background:var(--bg);color:var(--tx);border:1.5px solid var(--bdr-2);font-size:14px" onclick="mobPin('${k}')">${k}</button>`).join('')}
      </div>
      <div id="mob-pin-err" style="color:var(--red);font-size:11.5px;text-align:center;min-height:18px;margin-bottom:8px"></div>
      <button class="btn btn-primary btn-lg" style="width:100%;justify-content:center" onclick="mobSubmitPin()"><i class="ti ti-arrow-right"></i> Continue</button>
      <button onclick="MOB.step='select';MOB.pin='';renderMobScreen()" style="width:100%;padding:8px;border:none;background:transparent;color:var(--tx-3);font-size:12px;cursor:pointer;margin-top:6px">← Back</button>`;
    updateMobPinDots();
  }

  else if (MOB.step === 'gps') {
    pb.innerHTML = `
      <div style="text-align:center;padding:24px 0">
        <div class="gps-ring-outer"><div class="gps-pulse"></div><div class="gps-pulse-2"></div><div class="gps-core"><i class="ti ti-map-pin" style="color:#fff;font-size:18px"></i></div></div>
        <div style="font-size:14px;font-weight:700;margin-top:18px" id="gps-txt">Locating you…</div>
        <div style="font-size:12px;color:var(--tx-3);margin-top:5px" id="gps-sub">Verifying you're at ${SCHOOL.name}</div>
        <div id="gps-result-area" style="margin-top:14px"></div>
      </div>`;
    startGPS();
  }

  else if (MOB.step === 'done') {
    const u = USERS.find(x => x.id === MOB.empId);
    const cd = CLOCK_DATA[MOB.empId];
    const success = MOB.action === 'in';
    pb.innerHTML = `
      <div style="text-align:center;padding:20px 0">
        <div style="font-size:56px;margin-bottom:14px">${success ? '✅' : '👋'}</div>
        <div style="font-size:18px;font-weight:700;color:${success?'var(--green)':'var(--navy)'};margin-bottom:6px">${success ? 'Clocked In!' : 'Clocked Out!'}</div>
        <div style="font-size:13px;color:var(--tx-2);margin-bottom:4px">${u?.name}</div>
        <div style="font-size:13px;color:var(--tx-2)">Time: <strong>${success ? cd?.in : cd?.out}</strong></div>
        <div style="font-size:12px;margin-top:8px;color:${MOB.gpsResult?.ok?'var(--green)':'var(--amber)'}">
          <i class="ti ${MOB.gpsResult?.ok?'ti-map-pin':'ti-map-pin-off'}"></i>
          ${MOB.gpsResult?.ok ? `GPS verified · ${MOB.gpsResult.dist}m from school` : 'Location override used'}
        </div>
        <div style="background:var(--bg);border-radius:var(--r10);padding:10px;margin-top:14px;font-size:11.5px;color:var(--tx-2)">
          ${success?`Shift ends: <strong>${SCHEDULE.shifts[MOB.empId]?.Mon?.end || '16:00'}</strong>`:`Total today: <strong>${cd?.in && cd?.out ? 'see timesheets' : '—'}</strong>`}
        </div>
        <button onclick="MOB={step:'select',empId:null,pin:'',action:'in',gpsResult:null};renderMobScreen()" class="btn btn-primary" style="margin-top:18px;width:100%;justify-content:center"><i class="ti ti-arrow-left"></i> Back to names</button>
      </div>`;
  }
}

function mobSelectEmp(uid) {
  const cd = CLOCK_DATA[uid];
  MOB.empId = uid;
  MOB.action = cd?.status === 'in' ? 'out' : 'in';
  MOB.pin = '';
  MOB.step = 'pin';
  renderMobScreen();
}
function mobPin(k) {
  if (k === 'CLR') MOB.pin = '';
  else if (k === '⌫') MOB.pin = MOB.pin.slice(0, -1);
  else if (MOB.pin.length < 4) MOB.pin += k;
  updateMobPinDots();
  const errEl = $('mob-pin-err');
  if (errEl) errEl.textContent = '';
}
function updateMobPinDots() {
  const el = $('mob-pin-dots');
  if (el) el.textContent = '●'.repeat(MOB.pin.length) + '○'.repeat(4 - MOB.pin.length);
}
function mobSubmitPin() {
  const u = USERS.find(x => x.id === MOB.empId);
  if (!u || MOB.pin !== u.pin) {
    const err = $('mob-pin-err'); if (err) err.textContent = 'Incorrect PIN. Please try again.';
    MOB.pin = ''; updateMobPinDots(); return;
  }
  MOB.step = 'gps'; renderMobScreen();
}

function startGPS() {
  if (!navigator.geolocation) { showGPSFallback('GPS not supported in this browser.'); return; }
  const lat0 = parseFloat($('gps-lat')?.value || SCHOOL.lat);
  const lng0 = parseFloat($('gps-lng')?.value || SCHOOL.lng);
  const rad  = parseInt($('gps-radius')?.value || SCHOOL.radius);

  navigator.geolocation.getCurrentPosition(
    pos => {
      const { latitude: lat, longitude: lng, accuracy } = pos.coords;
      const dist = gpsDist(lat, lng, lat0, lng0);
      const within = dist <= rad;
      const gtxt = $('gps-txt'); const gsub = $('gps-sub'); const garea = $('gps-result-area');
      if (gtxt) gtxt.textContent = within ? '✅ Location verified!' : '⚠️ Outside school grounds';
      if (gsub) gsub.textContent = `You are ${dist}m from school${accuracy ? ` (±${Math.round(accuracy)}m accuracy)` : ''}`;
      if (within) {
        if (garea) garea.innerHTML = `<div class="gps-status-box success"><div style="font-size:13px;font-weight:600;color:var(--green-dk)">${dist}m from school · Within ${rad}m geofence</div></div>`;
        setTimeout(() => completeCheckin(true, lat, lng, dist), 1200);
      } else {
        if (garea) garea.innerHTML = `
          <div class="gps-status-box warning" style="margin-bottom:10px">
            <div style="font-size:13px;font-weight:600;color:var(--amber)">You are ${dist}m away (limit: ${rad}m)</div>
            <div style="font-size:11.5px;color:var(--tx-2);margin-top:4px">You appear to be outside the school geofence.</div>
          </div>
          ${isManager()?`<button class="btn btn-gold" style="width:100%;justify-content:center" onclick="completeCheckin(false,${lat},${lng},${dist})"><i class="ti ti-shield-check"></i> Admin Override & ${MOB.action==='in'?'Clock In':'Clock Out'}</button>`:'<div style="font-size:12px;color:var(--red);margin-top:8px">Please contact your manager to override.</div>'}`;
      }
    },
    err => showGPSFallback(err.code === 1 ? 'Location permission denied. Please enable in browser settings.' : 'Could not determine your location.'),
    { timeout: 10000, enableHighAccuracy: true, maximumAge: 30000 }
  );
}

function showGPSFallback(reason) {
  const gtxt=$('gps-txt'),gsub=$('gps-sub'),garea=$('gps-result-area');
  if(gtxt) gtxt.textContent='GPS Unavailable';
  if(gsub) gsub.textContent=reason;
  if(garea) garea.innerHTML=`
    <div class="gps-status-box warning" style="margin-bottom:10px"><div style="font-size:12px;color:var(--amber-lt);">${reason}</div><div style="font-size:11px;color:var(--tx-2);margin-top:4px">In the real mobile app, GPS works on-device automatically.</div></div>
    <button class="btn btn-primary" style="width:100%;justify-content:center;margin-bottom:8px" onclick="completeCheckin(false,null,null,null)"><i class="ti ti-login"></i> Continue (Demo / Override)</button>
    <button onclick="MOB.step='select';renderMobScreen()" style="width:100%;padding:8px;border:none;background:transparent;color:var(--tx-3);font-size:12px;cursor:pointer">← Cancel</button>`;
}

function completeCheckin(gpsOK, lat, lng, dist) {
  MOB.gpsResult = { ok: gpsOK, lat, lng, dist };
  doClock(MOB.empId, MOB.action, gpsOK, lat, lng, dist);
  MOB.step = 'done';
  renderMobScreen();
  pgCheckin(); // refresh live status panel
  // re-render phone screen after refresh
  setTimeout(()=>renderMobScreen(),50);
}

function saveGPSSettings() {
  SCHOOL.lat    = parseFloat($('gps-lat')?.value || SCHOOL.lat);
  SCHOOL.lng    = parseFloat($('gps-lng')?.value || SCHOOL.lng);
  SCHOOL.radius = parseInt($('gps-radius')?.value || SCHOOL.radius);
  toast('GPS geofence settings saved!', 'ok');
}
function adminClock(type) {
  const uid = parseInt($('admin-emp-sel')?.value);
  if (!uid) { toast('Please select a staff member.', 'warn'); return; }
  doClock(uid, type, false, null, null, null);
  pgCheckin();
}

function pgStaff() {
  // Check for duplicates in USERS roster
  const seen = {};
  const duplicates = [];
  USERS.forEach(u => {
    if (u.active) {
      const name = u.name.trim().toLowerCase();
      if (seen[name]) {
        if (!duplicates.some(d => d.name.trim().toLowerCase() === name)) {
          duplicates.push(seen[name]);
        }
        duplicates.push(u);
      } else {
        seen[name] = u;
      }
    }
  });

  let duplicateBanner = '';
  if (duplicates.length > 0) {
    duplicateBanner = `
      <div class="card" style="background:var(--red-lt);border:1.5px solid var(--red);margin-bottom:18px;padding:14px 18px">
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px">
          <div style="display:flex;align-items:center;gap:10px">
            <span style="font-size:22px">⚠️</span>
            <div>
              <div style="font-weight:700;color:#9a2215;font-size:13.5px">Duplicate Staff Names Detected!</div>
              <div style="font-size:12px;color:var(--tx-2);margin-top:2px">We detected duplicate active profiles for: <strong>${Array.from(new Set(duplicates.map(d=>d.name))).join(', ')}</strong>. This can cause login and punch reporting issues.</div>
            </div>
          </div>
          <button class="btn btn-red btn-sm" onclick="showDuplicateCleanup()"><i class="ti ti-trash"></i> Resolve Duplicates</button>
        </div>
      </div>`;
  }

  $('content-area').innerHTML = `
    ${duplicateBanner}
    <div style="display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap">
      <input class="fc" id="staff-search" style="max-width:260px;flex:1" placeholder="Search by name, role, department…" oninput="filterStaff(this.value, $('staff-role-filter').value, $('staff-dept-filter').value)">
      <select class="fc" id="staff-role-filter" style="width:160px" onchange="filterStaff($('staff-search').value, this.value, $('staff-dept-filter').value)">
        <option value="">All roles</option>
        <option value="principal_owner">Principal/Owner</option>
        <option value="administrator">Administrator</option>
        <option value="office_manager">Office Manager</option>
        <option value="office_assistant">Office Assistant</option>
        <option value="staff">Staff</option>
      </select>
      <select class="fc" id="staff-dept-filter" style="width:160px" onchange="filterStaff($('staff-search').value, $('staff-role-filter').value, this.value)">
        <option value="">All departments</option>
        ${SUBJECTS.map(d=>`<option value="${d}">${d}</option>`).join('')}
      </select>
    </div>
    <div class="card" style="padding:0;overflow:hidden">
      <div style="overflow-x:auto">
        <table class="tbl" id="staff-tbl">
          <thead><tr>
            <th style="min-width:200px">Name &amp; Email</th>
            <th>Role</th><th>Department</th><th>Position</th>
            <th>PIN</th><th>Phone</th><th>Status</th>
            ${can('manage_staff')?'<th>Actions</th>':''}
          </tr></thead>
          <tbody id="staff-tbody"></tbody>
        </table>
      </div>
    </div>`;
  renderStaffTable(USERS);
}

function renderStaffTable(list) {
  const tb = $('staff-tbody');
  if (!tb) return;
  tb.innerHTML = list.map(u => {
    const canDelete = !u.active && (CU.role === 'principal_owner' || CU.role === 'administrator');
    return `<tr style="opacity:${u.active?1:.5}">
    <td><div style="display:flex;align-items:center;gap:10px">${mkAv(u,32)}<div><div style="font-weight:600">${u.name}</div><div style="font-size:11px;color:var(--tx-3)">${u.email}</div></div></div></td>
    <td>${roleBadge(u.role)}</td>
    <td><div style="display:flex;align-items:center">${deptDot(u.dept)}<span>${u.dept}</span></div></td>
    <td style="font-size:12.5px;color:var(--tx-2)">${u.pos}</td>
    <td><code style="background:var(--bg);padding:2px 8px;border-radius:5px;font-size:12px;border:1px solid var(--bdr)">${u.pin}</code></td>
    <td style="font-size:12px;color:var(--tx-2)">${u.phone}</td>
    <td><span class="badge ${u.active?'badge-green':'badge-gray'}">${u.active?'Active':'Inactive'}</span></td>
    ${can('manage_staff')?`<td><div style="display:flex;gap:5px"><button class="btn btn-sm" onclick="editStaff(${u.id})"><i class="ti ti-edit"></i></button><button class="btn btn-sm ${u.active?'btn-red':'btn-green'}" onclick="toggleStaff(${u.id})">${u.active?'Deactivate':'Activate'}</button>${canDelete?`<button class="btn btn-sm btn-red" onclick="confirmDeleteStaff(${u.id})" title="Permanently delete this inactive employee"><i class="ti ti-trash"></i> Delete</button>`:''}</div></td>`:''}
  </tr>`;
  }).join('');
}
function filterStaff(q, role, dept) {
  const filtered = USERS.filter(u => {
    const matchQ = !q || u.name.toLowerCase().includes(q.toLowerCase()) || u.dept.toLowerCase().includes(q.toLowerCase()) || (u.email && u.email.toLowerCase().includes(q.toLowerCase()));
    const matchR = !role || u.role === role;
    const matchD = !dept || u.dept === dept;
    return matchQ && matchR && matchD;
  });
  renderStaffTable(filtered);
}
function toggleStaff(id) { 
  USERS = USERS.map(u => u.id === id ? { ...u, active: !u.active } : u); 
  saveUsers();
  pgStaff(); 
  toast('Staff status updated.', 'ok'); 
}

function confirmDeleteStaff(id) {
  const u = USERS.find(x => x.id === id);
  if (!u) return;
  if (u.active) { toast('Only inactive/deactivated employees can be deleted.', 'err'); return; }
  if (CU.role !== 'principal_owner' && CU.role !== 'administrator') { toast('Access Denied: Only Administrators can delete staff records.', 'err'); return; }
  
  openModal('⚠️ Permanently Delete Employee', `
    <div style="text-align:center;padding:10px 0">
      <div style="width:64px;height:64px;border-radius:50%;background:var(--red-lt);display:flex;align-items:center;justify-content:center;margin:0 auto 14px">
        <i class="ti ti-trash" style="font-size:28px;color:var(--red)"></i>
      </div>
      <div style="font-size:16px;font-weight:700;color:var(--red);margin-bottom:8px">Delete Employee Record</div>
      <div style="font-size:13px;color:var(--tx-2);line-height:1.55;margin-bottom:16px">
        Are you sure you want to <strong>permanently delete</strong> this employee record?<br>This action <strong>cannot be undone</strong>.
      </div>
      <div style="background:var(--bg);border-radius:var(--r12);padding:14px 18px;text-align:left;margin-bottom:14px">
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">
          ${mkAv(u, 40)}
          <div>
            <div style="font-weight:700;font-size:14px">${u.name}</div>
            <div style="font-size:12px;color:var(--tx-3)">${u.email}</div>
          </div>
        </div>
        <div style="font-size:11.5px;color:var(--tx-2);line-height:1.6">
          <strong>Role:</strong> ${ROLES[u.role]?.label || u.role} · <strong>Department:</strong> ${u.dept} · <strong>Position:</strong> ${u.pos}<br>
          <strong>Status:</strong> <span style="color:var(--red);font-weight:600">Inactive / Deactivated</span>
        </div>
      </div>
      <div style="background:var(--red-lt);border:1.5px solid var(--red);border-radius:var(--r10);padding:10px 14px;font-size:11.5px;color:#9a2215;text-align:left">
        <i class="ti ti-alert-triangle" style="margin-right:4px"></i>
        <strong>Warning:</strong> This will remove all schedule data, clock records, and messages associated with this employee.
      </div>
    </div>`,
    `<button class="btn btn-red" onclick="permanentDeleteStaff(${id})"><i class="ti ti-trash"></i> Delete Permanently</button><button class="btn" onclick="closeModal()">Cancel — Keep Record</button>`);
}

function permanentDeleteStaff(id) {
  const u = USERS.find(x => x.id === id);
  if (!u) return;
  
  // Remove from USERS
  USERS = USERS.filter(x => x.id !== id);
  saveUsers();
  
  // Remove schedule data
  if (SCHEDULE.shifts[id]) {
    delete SCHEDULE.shifts[id];
    saveSchedule();
  }
  
  // Remove clock data
  if (CLOCK_DATA[id]) {
    delete CLOCK_DATA[id];
    saveClockData();
  }
  
  // Remove check-in log entries
  CHECKIN_LOG = CHECKIN_LOG.filter(l => l.uid !== id);
  saveCheckinLog();
  
  // Remove messages involving this user
  MESSAGES = MESSAGES.filter(m => m.from !== id && m.to !== id);
  saveMessages();
  
  // Remove requests
  REQUESTS = REQUESTS.filter(r => r.uid !== id);
  saveRequests();
  
  closeModal();
  pgStaff();
  toast(`Employee "${u.name}" has been permanently deleted.`, 'ok');
}

function saveNewStaff(bypassDuplicateCheck = false) {
  const fn = $('nf-fn')?.value.trim(), ln = $('nf-ln')?.value.trim();

      openModal("Duplicate Name Detected", `

      return;
    }

  if (pin.length !== 4 || isNaN(pin)) { toast('PIN must be exactly 4 digits.', 'err'); return; }
  const email = $('nf-email')?.value.trim();

  const newId = Date.now();

    id: newId,

  saveSchedule();
  
  const newUser = USERS.find(x => x.id === newId);

  pgStaff();
  toast(`${name} added to the team!`, 'ok');

  setTimeout(() => showWelcomeEmail(newUser), 400);

function pgRequests() {
  const visible = isManager() ? REQUESTS : REQUESTS.filter(r => r.uid === CU.id);
  $('content-area').innerHTML = `
    ${isManager()?`<div class="tab-bar" id="req-tabs">
      <div class="tab active" onclick="filterRequests('all',this)">All (${REQUESTS.length})</div>
      <div class="tab" onclick="filterRequests('pending',this)">Pending (${REQUESTS.filter(r=>r.status==='pending').length})</div>
      <div class="tab" onclick="filterRequests('approved',this)">Approved</div>
      <div class="tab" onclick="filterRequests('denied',this)">Denied</div>
    </div>`:''}
    <div class="card" style="padding:0;overflow:hidden" id="req-card">
      <table class="tbl">
        <thead><tr>
          ${isManager()?'<th>Employee</th>':''}
          <th>Type</th><th>Dates</th><th>Days</th><th>Note</th><th>Submitted</th><th>Status</th>
          ${isManager()?'<th>Action</th>':''}
        </tr></thead>
        <tbody id="req-tbody"></tbody>
      </table>
    </div>`;
  renderRequestTable(visible);
}

function renderRequestTable(list) {
  const tb = $('req-tbody');
  if (!tb) return;
  tb.innerHTML = list.length === 0 ? `<tr><td colspan="${isManager()?8:6}" style="text-align:center;padding:30px;color:var(--tx-3)">No requests to display.</td></tr>` :
    list.map(r => {
      const e = USERS.find(u => u.id === r.uid);
      return `<tr>
        ${isManager()?`<td><div style="display:flex;align-items:center;gap:9px">${mkAv(e||{name:'?',av:'?'},28)}<span style="font-size:12.5px;font-weight:500">${e?.name}</span></div></td>`:''}
        <td><span class="badge badge-blue">${r.type}</span></td>
        <td style="font-weight:600;font-size:12.5px">${r.dates}</td>
        <td style="font-size:12.5px">${r.days}d</td>
        <td style="font-size:12px;color:var(--tx-2)">${r.note||'—'}</td>
        <td style="font-size:12px;color:var(--tx-3)">${r.submitted}</td>
        <td>${statusBadge(r.status)}</td>
        ${isManager()&&r.status==='pending'?`<td><div style="display:flex;gap:5px"><button class="btn btn-green btn-sm" onclick="approveRequest(${r.id})"><i class="ti ti-check"></i> Approve</button><button class="btn btn-red btn-sm" onclick="denyRequest(${r.id})"><i class="ti ti-x"></i> Deny</button></div></td>`:isManager()?'<td></td>':''}
      </tr>`;
    }).join('');
}
function filterRequests(status, tab) {
  document.querySelectorAll('#req-tabs .tab').forEach(t => t.classList.remove('active'));
  if (tab) tab.classList.add('active');
  const list = status==='all' ? REQUESTS : REQUESTS.filter(r=>r.status===status);
  renderRequestTable(list);
}
function approveRequest(id) { REQUESTS = REQUESTS.map(r => r.id===id?{...r,status:'approved'}:r); saveRequests(); pgRequests(); buildSidebar(); toast('Request approved!','ok'); }
function denyRequest(id) { REQUESTS = REQUESTS.map(r => r.id===id?{...r,status:'denied'}:r); saveRequests(); pgRequests(); buildSidebar(); toast('Request denied.','info'); }
function showNewRequest() {
  openModal('Submit Time-Off Request', `
    <div class="fg"><label class="fl">Request type</label><select class="fc" id="rq-type"><option>Vacation</option><option>Sick Leave</option><option>Personal Day</option><option>Professional Development</option><option>Bereavement</option><option>Unpaid Leave</option></select></div>

    `<button class="btn btn-primary" onclick="submitRequest()"><i class="ti ti-send"></i> Submit Request</button><button class="btn" onclick="closeModal()">Cancel</button>`);
}
function submitRequest() {
  const dates = $('rq-dates')?.value.trim();
  if (!dates) { toast('Please enter the date(s).','err'); return; }
  REQUESTS.push({ id: Date.now(), uid: CU.id, type: $('rq-type')?.value, dates, days: parseInt($('rq-days')?.value)||1, note: $('rq-note')?.value||'', status:'pending', submitted: new Date().toLocaleDateString('en-CA',{month:'short',day:'numeric'}) });

  closeModal(); navigate('requests'); toast('Request submitted! Your manager will review it.','ok');
}

function selectChat(uid) {
  ACTIVE_CHAT_UID = uid;
  renderCommTab();
}

function renderChatMessages(uid) {
  const thread = MESSAGES.filter(m => (m.from === CU.id && m.to === uid) || (m.from === uid && m.to === CU.id));
  if (thread.length === 0) {
    return `<div style="text-align:center;padding:40px;color:var(--tx-3);font-size:12.5px;font-style:italic">No messages yet. Say hello to start the conversation!</div>`;
  }
  
  return thread.map(m => {
    const isMe = m.from === CU.id;
    const alignStyle = isMe ? 'align-self:flex-end;align-items:flex-end' : 'align-self:flex-start;align-items:flex-start';
    const bubbleStyle = isMe 
      ? 'background:var(--navy);color:#fff;border-radius:14px 14px 2px 14px;border:1px solid var(--navy)' 
      : 'background:#fff;border:1px solid #e2e8f0;color:var(--tx);border-radius:14px 14px 14px 2px;box-shadow:var(--sh-sm)';
    
    return `
      <div style="display:flex;flex-direction:column;max-width:70%;margin-bottom:3px;${alignStyle}">
        <div style="padding:10px 14px;font-size:12.5px;line-height:1.45;${bubbleStyle}">
          ${m.body.replace(/\n/g, '<br>')}
        </div>
        <div style="font-size:10px;color:var(--tx-3);margin-top:4px;margin-bottom:2px">${m.date}</div>
      </div>
    `;
  }).join('');
}

function sendDirectMessage(uid) {
  const inp = $('dm-input');
  const body = inp?.value.trim();
  if (!body) return;
  
  const newMsg = {
    id: Date.now(),
    from: CU.id,
    to: uid,
    body: body,
    date: new Date().toLocaleString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }),
    read: false
  };
  
  MESSAGES.push(newMsg);
  saveMessages();
  inp.value = '';
  
  renderCommTab();
  
  setTimeout(() => {
    const chatBody = $('dm-chat-body');
    if (chatBody) chatBody.scrollTop = chatBody.scrollHeight;
  }, 30);
}
function showNewAnnouncement() {
  openModal('Post Announcement to All Staff', `
    <div class="fg"><label class="fl">Title</label><input class="fc" id="an-title" placeholder="Announcement title…"></div>
    <div class="fg"><label class="fl">Message body</label><textarea class="fc" id="an-body" rows="5" placeholder="Write your message to all staff members…" style="resize:vertical"></textarea></div>
    <div class="fg"><label class="fl">Priority</label>
      <select class="fc" id="an-priority"><option value="normal">Normal</option><option value="high">High Priority (shown in red)</option></select></div>`,
    `<button class="btn btn-primary" onclick="postAnnouncement()"><i class="ti ti-speakerphone"></i> Post to All Staff</button><button class="btn" onclick="closeModal()">Cancel</button>`);
}
function postAnnouncement() {
  const title = $('an-title')?.value.trim(), body = $('an-body')?.value.trim();
  if (!title||!body) { toast('Title and message are required.','err'); return; }
  ANNOUNCEMENTS.unshift({ id:Date.now(), from:CU.id, title, body, priority:$('an-priority')?.value||'normal', date: new Date().toLocaleDateString('en-CA',{month:'short',day:'numeric'}) });
  saveAnnouncements();
  closeModal(); pgAnnouncements(); toast('Announcement posted to all staff!','ok');
}

function saveSchoolInfo() {
  const schoolName = $('set-school-name').value.trim();
  const address = $('set-school-address').value.trim();
  const website = $('set-school-website').value.trim();
  const email = $('set-school-email').value.trim();
  
  if (!schoolName) { toast('School name is required.', 'err'); return; }
  SCHOOL.name = schoolName;
  SCHOOL.address = address;
  SCHOOL.website = website;
  SCHOOL.email = email;
  
  saveSchool();
  initSchoolName();
  toast('School information saved successfully!', 'ok');
}

function saveGpsSettings() {
  const lat = parseFloat($('set-gps-lat').value);
  const lng = parseFloat($('set-gps-lng').value);
  const radius = parseInt($('set-gps-radius').value);
  
  if (isNaN(lat) || isNaN(lng) || isNaN(radius)) { toast('All coordinates & radius must be valid numbers.', 'err'); return; }
  SCHOOL.lat = lat;
  SCHOOL.lng = lng;
  SCHOOL.radius = radius;
  
  saveSchool();
  toast('GPS Geofence configurations updated!', 'ok');
}

function saveSchedSettings() {
  const threshold = parseFloat($('set-ot-threshold').value);
  if (isNaN(threshold) || threshold <= 0) { toast('Overtime threshold must be a valid number.', 'err'); return; }
  
  const checkedBoxes = document.querySelectorAll('input[name="school-open-days"]:checked');
  const selectedDays = Array.from(checkedBoxes).map(cb => cb.value);
  
  if (selectedDays.length === 0) {
    toast('You must select at least one open day for the school.', 'err');
    return;
  }
  
  SCHOOL.otThreshold = threshold;
  SCHOOL.openDays = selectedDays;
  saveSchool();
  
  // Re-derive DAYS and FULL_DAYS
  DAYS = SCHOOL.openDays;
  FULL_DAYS = DAYS.map(d => WEEKDAY_NAMES[d]);
  
  // Roster schedule safety sync
  USERS.forEach(u => {
    if (u.role === 'principal_owner' || u.role === 'administrator' || u.role === 'office_manager' || u.role === 'office_assistant' || u.role === 'staff') {
      if (!SCHEDULE.shifts[u.id]) SCHEDULE.shifts[u.id] = {};
      DAYS.forEach(d => {
        if (!SCHEDULE.shifts[u.id][d]) {
          SCHEDULE.shifts[u.id][d] = { type: 'Off', start: null, end: null, location: 'Office', notes: '', ack: false };
        }
      });
    }
  });
  saveSchedule();
  
  toast('Scheduling & Open Days settings saved!', 'ok');
  pgSettings();
}

          <div class="sec-hd" style="margin-bottom:14px"><div class="sec-title"><i class="ti ti-bell" style="color:var(--amber);font-size:16px"></i> Notification Settings</div></div>
          ${[
            ['Late check-in alerts (15+ min)',true],
            ['Missed clock-out alerts',true],
            ['Overtime threshold warnings',true],
            ['New time-off requests',true],
            ['Schedule published notification',true],
            ['Shift reminder (1hr before)',true],
            ['GPS geofence violation alerts',true],
            ['New staff member added',false],
          ].map(([lbl,on])=>`<label style="display:flex;justify-content:space-between;align-items:center;margin-bottom:13px;cursor:pointer;font-size:13px">
            <span>${lbl}</span>
            <div onclick="this.dataset.on=this.dataset.on==='0'?'1':'0';this.style.background=this.dataset.on==='0'?'var(--bdr-2)':'var(--green)';this.firstElementChild.style.left=this.dataset.on==='0'?'3px':'21px'" data-on="${on?1:0}" style="width:42px;height:24px;border-radius:12px;background:${on?'var(--green)':'var(--bdr-2)'};position:relative;cursor:pointer;transition:background .2s;flex-shrink:0">
              <div style="width:18px;height:18px;border-radius:50%;background:#fff;position:absolute;top:3px;left:${on?21:3}px;transition:left .2s;box-shadow:0 1px 4px rgba(0,0,0,.2)"></div>
            </div>
          </label>`).join('')}
          <button class="btn btn-primary btn-sm" onclick="toast('Notification preferences saved!','ok')"><i class="ti ti-device-floppy"></i> Save Notifications</button>
        </div>
      </div>
    </div>
    
    <!-- ADMINISTRATIVE & REFERENCE SECTIONS (Bottom) -->
    <div style="max-width:900px">
      <div style="border-top:2px solid var(--bdr);margin-bottom:18px;padding-top:18px">
        <div style="font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--tx-3);font-weight:700;margin-bottom:14px"><i class="ti ti-settings" style="font-size:13px"></i> ADMINISTRATION & REFERENCE</div>
      </div>
      <div class="g2">
        <div class="card">
          <div class="sec-hd" style="margin-bottom:14px"><div class="sec-title"><i class="ti ti-brand-appstore" style="font-size:16px;color:var(--gold)"></i> Mobile App & iOS/Android Download</div></div>
          <div style="font-size:12.5px;color:var(--tx-2);line-height:1.4;margin-bottom:12px">
            StaffBase is built as a highly optimized, fully responsive <strong>Progressive Web App (PWA)</strong>. Your school staff can install it directly onto their phone homescreens.
          </div>
          <div style="background:var(--bg);border-radius:var(--r10);padding:10px;margin-bottom:10px;font-size:11px;line-height:1.3">
            <strong>📲 iOS (iPhone/iPad):</strong><br>
            Open Safari, go to this URL, tap the <i class="ti ti-share"></i> <strong>Share</strong> button, and select <strong>"Add to Home Screen"</strong>. Installs instantly with a native icon!
          </div>
          <div style="background:var(--bg);border-radius:var(--r10);padding:10px;margin-bottom:10px;font-size:11px;line-height:1.3">
            <strong>🤖 Android (Play Store):</strong><br>
            Open Chrome, go to this URL, tap the <i class="ti ti-dots-vertical"></i> options, and tap <strong>"Install App"</strong>.
          </div>
          <div style="border-top:1px dashed var(--bdr);padding-top:10px;font-size:10.5px;color:var(--tx-3);line-height:1.3">
            <strong>📦 App Store Publishing Guide:</strong><br>
            To offer a native downloadable package on Google Play or iOS App Store, simply wrap this PWA using <strong>CapacitorJS</strong> or <strong>TWA (Trusted Web Activity)</strong> in under 10 minutes. This builds native <code>.apk</code>/<code>.aab</code> and <code>.ipa</code> packages.
          </div>
        </div>
        <div class="card">
          <div class="sec-hd" style="margin-bottom:14px"><div class="sec-title"><i class="ti ti-shield-lock" style="font-size:16px;color:var(--navy)"></i> Roles & Permissions</div></div>
          <div style="font-size:12px;color:var(--tx-3);margin-bottom:12px">What each role can do in StaffBase</div>
          <table class="tbl" style="font-size:11.5px">
            <thead><tr><th style="min-width:140px">Permission</th><th style="text-align:center">Owner</th><th style="text-align:center">Admin</th><th style="text-align:center">Ofc Mgr</th><th style="text-align:center">Coord</th><th style="text-align:center">TA</th><th style="text-align:center">Grader</th></tr></thead>
            <tbody>
              ${[
                ['View own schedule','✅','✅','✅','✅','✅','✅'],
                ['Acknowledge shifts','✅','✅','✅','✅','✅','✅'],
                ['Clock in/out (GPS)','✅','✅','✅','✅','✅','✅'],
                ['Submit time-off','✅','✅','✅','✅','✅','✅'],
                ['View all timesheets','✅','✅','✅','✅','❌','❌'],
                ['Edit schedules','✅','✅','✅','✅','❌','❌'],
                ['Publish schedules','✅','✅','✅','✅','❌','❌'],
                ['Approve time-off','✅','✅','✅','✅','❌','❌'],
                ['Post announcements','✅','✅','✅','✅','❌','❌'],
                ['View all reports','✅','✅','✅','✅','❌','❌'],
                ['GPS override','✅','✅','✅','✅','❌','❌'],
                ['Manage staff roster','✅','✅','❌','❌','❌','❌'],
                ['Edit staff PINs','✅','✅','❌','❌','❌','❌'],
                ['Change system settings','✅','✅','❌','❌','❌','❌'],
                ['Add admin accounts','✅','❌','❌','❌','❌','❌'],
              ].map(r=>`<tr><td>${r[0]}</td>${r.slice(1).map(v=>`<td style="text-align:center">${v}</td>`).join('')}</tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>
    </div>`;
  renderSettingsSubjects();
}

function renderSettingsSubjects() {
  const container = $('settings-subject-list');
  if (!container) return;
  container.innerHTML = SUBJECTS.map(sub => {
    const col = getSubjectColor(sub);
    return `<div style="display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--bdr-2);padding:6px 12px;border-radius:var(--r8);font-size:12px;font-weight:600;color:var(--tx)">
      <span style="width:8px;height:8px;border-radius:50%;background:${col}"></span>
      <span>${sub}</span>
      <span onclick="deleteSubjectFromSettings('${sub}')" style="cursor:pointer;color:var(--red);margin-left:4px;display:flex;align-items:center" title="Delete Subject"><i class="ti ti-x" style="font-size:13px"></i></span>
    </div>`;
  }).join('');
}

function addSubjectFromSettings() {
  const inp = $('new-subject-input');
  const val = inp?.value.trim();
  if (!val) { toast('Subject name cannot be empty.', 'err'); return; }
  if (SUBJECTS.includes(val)) { toast('Subject already exists.', 'err'); return; }
  
  SUBJECTS.push(val);
  saveSubjects();
  inp.value = '';
  renderSettingsSubjects();
  toast(`Subject "${val}" added successfully!`, 'ok');
}

function deleteSubjectFromSettings(sub) {
  if (SUBJECTS.length <= 1) {
    toast('You must have at least one academic subject.', 'err');
    return;
  }
  const assigned = USERS.filter(u => u.dept === sub && u.active);
  if (assigned.length > 0) {
    toast(`Cannot delete: ${assigned.length} staff member(s) are currently assigned to "${sub}".`, 'err');
    return;
  }
  SUBJECTS = SUBJECTS.filter(x => x !== sub);
  saveSubjects();
  renderSettingsSubjects();
  toast(`Subject "${sub}" removed.`, 'ok');
}
</script>
</body>
</html>
