async function saveNewStaff(bypassDuplicateCheck = false) {
  const fn = $('nf-fn')?.value.trim(), ln = $('nf-ln')?.value.trim();
  if (!fn || !ln) { toast('First and last name are required.', 'err'); return; }
  const name = `${fn} ${ln}`;
  
  if (!bypassDuplicateCheck) {
    const duplicate = USERS.find(u => u.name.trim().toLowerCase() === name.toLowerCase() && u.active);
    if (duplicate) {
      openModal("Duplicate Name Detected", `
        <div style="text-align:center;padding:10px 0">
          <div style="font-size:42px;margin-bottom:12px">⚠️</div>
          <div style="font-size:15px;font-weight:700;margin-bottom:8px">Duplicate Staff Name Detected</div>
          <div style="font-size:12.5px;color:var(--tx-2);line-height:1.5;margin-bottom:14px">
            A staff member named <strong>"${name}"</strong> already exists in the system.<br>
            To prevent reporting errors, we do not allow duplicate active staff names.
          </div>
          <div style="background:var(--bg);border-radius:var(--r10);padding:10px 12px;font-size:11px;color:var(--tx-2);margin-bottom:14px;text-align:left">
            <strong>Existing profile:</strong> ${duplicate.pos} · ${duplicate.dept} Department
          </div>
        </div>`,
        `<button class="btn btn-red" onclick="deleteAndConfirmAddStaff('${duplicate.name}', ${duplicate.id})"><i class="ti ti-trash"></i> Delete Duplicate & Add New</button>
         <button class="btn" onclick="closeModal()">Keep Existing / Rename</button>`);
      return;
    }
  }

  const pin = $('nf-pin')?.value || '0000';
  if (pin.length !== 4 || isNaN(pin)) { toast('PIN must be exactly 4 digits.', 'err'); return; }
  const email = $('nf-email')?.value.trim();
  if (!email) { toast('Email is required.', 'err'); return; }
  const password = $('nf-pass')?.value || '';
  const role = $('nf-role')?.value || 'staff';
  const dept = $('nf-dept')?.value || 'Administration';
  const pos  = $('nf-pos')?.value || '';
  const phone = $('nf-phone')?.value || '';
  const av   = `${fn[0]}${ln[0]}`.toUpperCase();

  let newId;
  if (USE_API) {
    try {
      const r = await fetch(`${API_BASE}/staff`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, pin, password, role, dept, pos, av })
      });
      const data = await r.json();
      if (!r.ok) { toast(data.error || 'Failed to add staff.', 'err'); return; }
      newId = data.id; // DB-generated integer ID
    } catch (e) { toast('Connection error saving staff.', 'err'); return; }
  } else {
    newId = Date.now();
  }

  USERS.push({ id: newId, name, email, role, dept, pin: USE_API ? '****' : pin, password, phone, pos, av, active: true });
  
  // Allocate default schedule slots
  SCHEDULE.shifts[newId] = {};
  DAYS.forEach(d => {
    SCHEDULE.shifts[newId][d] = { type: 'Off', start: null, end: null, location: 'Office', notes: '', ack: false };
  });
  
  saveUsers();
  saveSchedule();
  
  const newUser = USERS.find(x => x.id === newId);
  closeModal();
  pgStaff();
  toast(`${name} added to the team!`, 'ok');
  
  // Trigger welcome email simulation — pass raw PIN before API mode masks it
  setTimeout(() => showWelcomeEmail(newUser, pin), 400);
}

function deleteAndConfirmAddStaff(name, oldId) {
  USERS = USERS.filter(u => u.id !== oldId);
  saveUsers();
  closeModal();
  saveNewStaff(true); // Bypass duplicate check this time
}

function showDuplicateCleanup() {
  const seen = {};
  const duplicates = [];
  USERS.forEach(u => {
    if (u.active) {
      const name = u.name.trim().toLowerCase();
      if (seen[name]) {
        if (!duplicates.some(d => d.original.id === seen[name].id)) {
          duplicates.push({ original: seen[name], duplicate: u });
        }
      } else {
        seen[name] = u;
      }
    }
  });

  openModal("Resolve Duplicate Staff Names", `

      <div class="tab" onclick="filterRequests('pending',this)">Pending (${REQUESTS.filter(r=>r.status==='pending').length})</div>
      <div class="tab" onclick="filterRequests('approved',this)">Approved</div>
      <div class="tab" onclick="filterRequests('denied',this)">Denied</div>
    </div>`:''}
    <div class="card" style="padding:0;overflow:hidden" id="req-card">
      <table class="tbl">
        <thead><tr>
          ${isManager()?'<th>Employee</th>':''}
          <th>Type</th><th>Dates</th><th>Days</th><th>Note</th><th>Submitted</th><th>Status</th>
          ${isManager()?'<th>Action</th>':''}
        </tr></thead>
        <tbody id="req-tbody"></tbody>
      </table>
    </div>`;
  renderRequestTable(visible);
}

function renderRequestTable(list) {
  const tb = $('req-tbody');
  if (!tb) return;
  tb.innerHTML = list.length === 0 ? `<tr><td colspan="${isManager()?8:6}" style="text-align:center;padding:30px;color:var(--tx-3)">No requests to display.</td></tr>` :
    list.map(r => {
      const e = USERS.find(u => u.id === r.uid);
      return `<tr>
        ${isManager()?`<td><div style="display:flex;align-items:center;gap:9px">${mkAv(e||{name:'?',av:'?'},28)}<span style="font-size:12.5px;font-weight:500">${e?.name}</span></div></td>`:''}
        <td><span class="badge badge-blue">${r.type}</span></td>
        <td style="font-weight:600;font-size:12.5px">${r.dates}</td>
        <td style="font-size:12.5px">${r.days}d</td>
        <td style="font-size:12px;color:var(--tx-2)">${r.note||'—'}</td>
        <td style="font-size:12px;color:var(--tx-3)">${r.submitted}</td>
        <td>${statusBadge(r.status)}</td>
        ${isManager()&&r.status==='pending'?`<td><div style="display:flex;gap:5px"><button class="btn btn-green btn-sm" onclick="approveRequest(${r.id})"><i class="ti ti-check"></i> Approve</button><button class="btn btn-red btn-sm" onclick="denyRequest(${r.id})"><i class="ti ti-x"></i> Deny</button></div></td>`:isManager()?'<td></td>':''}
      </tr>`;
    }).join('');
}
function filterRequests(status, tab) {
  document.querySelectorAll('#req-tabs .tab').forEach(t => t.classList.remove('active'));
  if (tab) tab.classList.add('active');
  const list = status==='all' ? REQUESTS : REQUESTS.filter(r=>r.status===status);
  renderRequestTable(list);
}
function approveRequest(id) { REQUESTS = REQUESTS.map(r => r.id===id?{...r,status:'approved'}:r); saveRequests(); pgRequests(); buildSidebar(); toast('Request approved!','ok'); }
function denyRequest(id) { REQUESTS = REQUESTS.map(r => r.id===id?{...r,status:'denied'}:r); saveRequests(); pgRequests(); buildSidebar(); toast('Request denied.','info'); }
function showNewRequest() {
  openModal('Submit Time-Off Request', `
    <div class="fg"><label class="fl">Request type</label><select class="fc" id="rq-type"><option>Vacation</option><option>Sick Leave</option><option>Personal Day</option><option>Professional Development</option><option>Bereavement</option><option>Unpaid Leave</option></select></div>
    <div class="fg"><label class="fl">Date(s)</label><input class="fc" id="rq-dates" placeholder="e.g. Jun 3–5, 2026 or Jun 3, 2026"></div>
    <div class="fg"><label class="fl">Number of days</label><input class="fc" id="rq-days" type="number" value="1" min="1"></div>
    <div class="fg"><label class="fl">Notes / reason (optional)</label><textarea class="fc" id="rq-note" rows="3" placeholder="Any additional context for your manager…" style="resize:vertical"></textarea></div>`,
    `<button class="btn btn-primary" onclick="submitRequest()"><i class="ti ti-send"></i> Submit Request</button><button class="btn" onclick="closeModal()">Cancel</button>`);
}
function submitRequest() {
  const dates = $('rq-dates')?.value.trim();
  if (!dates) { toast('Please enter the date(s).','err'); return; }
  REQUESTS.push({ id: Date.now(), uid: CU.id, type: $('rq-type')?.value, dates, days: parseInt($('rq-days')?.value)||1, note: $('rq-note')?.value||'', status:'pending', submitted: new Date().toLocaleDateString('en-CA',{month:'short',day:'numeric'}) });
  saveRequests();
  closeModal(); navigate('requests'); toast('Request submitted! Your manager will review it.','ok');
}

let COMM_TAB = 'broadcast';
let ACTIVE_CHAT_UID = null;

function pgAnnouncements() {
  $('content-area').innerHTML = `
    <div class="tab-bar" style="margin-bottom:18px">
      <div class="tab ${COMM_TAB === 'broadcast' ? 'active' : ''}" onclick="setCommTab('broadcast')"><i class="ti ti-speakerphone"></i> School Announcements</div>

        ${getUnreadMessageCount() > 0 ? `<span style="background:var(--gold);color:#fff;font-size:9.5px;padding:2px 5px;border-radius:10px;font-weight:700;line-height:1">${getUnreadMessageCount()}</span>` : ''}
      </div>

    <div id="comm-tab-content"></div>

}

function setCommTab(tab) {
  COMM_TAB = tab;
  pgAnnouncements();
  buildSidebar();
}

function getUnreadMessageCount(fromUid = null) {
  if (fromUid) {
    return MESSAGES.filter(m => m.to === CU.id && m.from === fromUid && !m.read).length;
  }
  return MESSAGES.filter(m => m.to === CU.id && !m.read).length;
}

function renderCommTab() {
  const container = $('comm-tab-content');
  if (!container) return;
  
  if (COMM_TAB === 'broadcast') {
    container.innerHTML = `
      <div style="max-width:720px; max-height:65vh; overflow-y:auto; padding-right:8px">
        ${ANNOUNCEMENTS.map(a => {
          const author = USERS.find(u => u.id === a.from);
          return `<div class="card ann-card ${a.priority==='high'?'high':''}" style="margin-bottom:14px">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px">
              <div style="font-size:15px;font-weight:700;color:${a.priority==='high'?'var(--red)':'var(--tx)'};line-height:1.3">
                ${a.priority==='high'?'<i class="ti ti-alert-circle" style="color:var(--red);margin-right:6px"></i>':''}${a.title}
              </div>
              <div style="font-size:11px;color:var(--tx-3);white-space:nowrap;margin-left:16px;margin-top:2px">${a.date}</div>
            </div>
            <div style="font-size:13px;color:var(--tx-2);line-height:1.65;margin-bottom:12px">${a.body}</div>
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
              ${mkAv(author||{name:'?',av:'?'},22)}
              <span style="font-size:12px;color:var(--tx-3)">Posted by <strong>${author?.name}</strong> · ${author?.pos}</span>
              ${a.priority==='high'?'<span class="badge badge-red"><i class="ti ti-alert-triangle"></i> High Priority</span>':''}
            </div>
          </div>`;
        }).join('')}
        ${ANNOUNCEMENTS.length===0?'<div class="card" style="text-align:center;padding:40px;color:var(--tx-3)">No announcements yet.</div>':''}
      </div>
    `;
  } else {
    const chatUsers = USERS.filter(u => u.id !== CU.id && u.active);
    if (!ACTIVE_CHAT_UID && chatUsers.length > 0) {
      ACTIVE_CHAT_UID = chatUsers[0].id;
    }
    
    if (ACTIVE_CHAT_UID) {
      MESSAGES.forEach(m => {
        if (m.to === CU.id && m.from === ACTIVE_CHAT_UID) {
          m.read = true;
        }
      });
      saveMessages();
    }
    
    const activeUser = USERS.find(u => u.id === ACTIVE_CHAT_UID);
    
    container.innerHTML = `
      <div class="card" style="padding:0;overflow:hidden;height:65vh;display:flex;border:1px solid var(--bdr)">
        <!-- Left Side: Roster -->
        <div style="width:260px;border-right:1px solid var(--bdr);display:flex;flex-direction:column;background:var(--sfc-2);flex-shrink:0">
          <div style="padding:12px;font-size:12px;font-weight:700;color:var(--tx-3);border-bottom:1px solid var(--bdr);background:var(--sfc)">
            STAFF DIRECTORY
          </div>
          <div style="flex:1;overflow-y:auto;padding:8px">
            ${chatUsers.map(u => {
              const activeClass = u.id === ACTIVE_CHAT_UID ? 'background:rgba(224,136,32,.08);border-color:rgba(224,136,32,.25);color:var(--tx)' : 'background:transparent;border-color:transparent;color:var(--tx-2)';
              const unread = getUnreadMessageCount(u.id);
              const lastMsg = MESSAGES.filter(m => (m.from === CU.id && m.to === u.id) || (m.from === u.id && m.to === CU.id)).pop();
              const snippet = lastMsg ? lastMsg.body : 'No messages yet';
              
              return `
                <div onclick="selectChat('${u.id}')" style="display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--r10);border:1.5px solid transparent;cursor:pointer;margin-bottom:4px;transition:all .15s;${activeClass}">
                  ${mkAv(u, 30)}
                  <div style="flex:1;min-width:0">
                    <div style="display:flex;justify-content:space-between;align-items:center">
                      <span style="font-weight:600;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${u.name.split(' ')[0]} ${u.name.split(' ').pop()}</span>
                      ${unread > 0 ? `<span style="width:7px;height:7px;border-radius:50%;background:var(--gold);flex-shrink:0"></span>` : ''}
                    </div>
                    <div style="font-size:11px;color:var(--tx-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px">${snippet}</div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
        
        <!-- Right Side: Messaging Workspace -->
        <div style="flex:1;display:flex;flex-direction:column;background:var(--sfc)">
          ${activeUser ? `
            <!-- Chat Header -->
            <div style="padding:12px 20px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;background:var(--sfc);flex-shrink:0">
              <div style="display:flex;align-items:center;gap:10px">
                ${mkAv(activeUser, 34)}
                <div>
                  <div style="font-weight:700;font-size:13.5px;color:var(--tx)">${activeUser.name}</div>
                  <div style="font-size:11px;color:var(--tx-3)">${activeUser.pos} · ${activeUser.dept} Department</div>
                </div>

              <div>${roleBadge(activeUser.role)}</div>
            </div>
            
            <!-- Messages bubbles container -->
            <div id="dm-chat-body" style="flex:1;overflow-y:auto;padding:20px;background:#f8fafb;display:flex;flex-direction:column;gap:12px">
              ${renderChatMessages(activeUser.id)}
            </div>
            
            <!-- Chat Input footer -->
            <div style="padding:14px 20px;border-top:1px solid var(--bdr);background:var(--sfc);display:flex;gap:10px;align-items:center;flex-shrink:0">
              <input class="fc" id="dm-input" placeholder="Type a private message to ${activeUser.name.split(' ')[0]}…" onkeydown="if(event.key==='Enter')sendDirectMessage(${activeUser.id})" style="flex:1;background:var(--sfc-2)">
              <button class="btn btn-primary" onclick="sendDirectMessage(${activeUser.id})" style="padding:9px 18px"><i class="ti ti-send"></i> Send</button>
            </div>
          ` : `
            <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--tx-3);padding:40px;text-align:center">
              <i class="ti ti-message-2" style="font-size:48px;margin-bottom:12px;color:var(--tx-4)"></i>
              <div style="font-size:15px;font-weight:600">No Active Conversation</div>

function selectChat(uid) {
  ACTIVE_CHAT_UID = uid;
  renderCommTab();
}

function renderChatMessages(uid) {
  const thread = MESSAGES.filter(m => (m.from === CU.id && m.to === uid) || (m.from === uid && m.to === CU.id));
  if (thread.length === 0) {
    return `<div style="text-align:center;padding:40px;color:var(--tx-3);font-size:12.5px;font-style:italic">No messages yet. Say hello to start the conversation!</div>`;
  }
  
  return thread.map(m => {
    const isMe = m.from === CU.id;
    const alignStyle = isMe ? 'align-self:flex-end;align-items:flex-end' : 'align-self:flex-start;align-items:flex-start';
    const bubbleStyle = isMe 
      ? 'background:var(--navy);color:#fff;border-radius:14px 14px 2px 14px;border:1px solid var(--navy)' 
      : 'background:#fff;border:1px solid #e2e8f0;color:var(--tx);border-radius:14px 14px 14px 2px;box-shadow:var(--sh-sm)';
    
    return `
      <div style="display:flex;flex-direction:column;max-width:70%;margin-bottom:3px;${alignStyle}">
        <div style="padding:10px 14px;font-size:12.5px;line-height:1.45;${bubbleStyle}">
          ${m.body.replace(/\n/g, '<br>')}
        </div>
        <div style="font-size:10px;color:var(--tx-3);margin-top:4px;margin-bottom:2px">${m.date}</div>
      </div>
    `;
  }).join('');
}

function sendDirectMessage(uid) {
  const inp = $('dm-input');
  const body = inp?.value.trim();
  if (!body) return;
  
  const newMsg = {
    id: Date.now(),
    from: CU.id,
    to: uid,
    body: body,
    date: new Date().toLocaleString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }),
    read: false
  };
  
  MESSAGES.push(newMsg);
  saveMessages();
  inp.value = '';
  
  renderCommTab();
  
  setTimeout(() => {
    const chatBody = $('dm-chat-body');
    if (chatBody) chatBody.scrollTop = chatBody.scrollHeight;
  }, 30);
}
function showNewAnnouncement() {
  openModal('Post Announcement to All Staff', `
    <div class="fg"><label class="fl">Title</label><input class="fc" id="an-title" placeholder="Announcement title…"></div>
    <div class="fg"><label class="fl">Message body</label><textarea class="fc" id="an-body" rows="5" placeholder="Write your message to all staff members…" style="resize:vertical"></textarea></div>
    <div class="fg"><label class="fl">Priority</label>
      <select class="fc" id="an-priority"><option value="normal">Normal</option><option value="high">High Priority (shown in red)</option></select></div>`,
    `<button class="btn btn-primary" onclick="postAnnouncement()"><i class="ti ti-speakerphone"></i> Post to All Staff</button><button class="btn" onclick="closeModal()">Cancel</button>`);
}
function postAnnouncement() {
  const title = $('an-title')?.value.trim(), body = $('an-body')?.value.trim();
  if (!title||!body) { toast('Title and message are required.','err'); return; }
  ANNOUNCEMENTS.unshift({ id:Date.now(), from:CU.id, title, body, priority:$('an-priority')?.value||'normal', date: new Date().toLocaleDateString('en-CA',{month:'short',day:'numeric'}) });
  saveAnnouncements();
  closeModal(); pgAnnouncements(); toast('Announcement posted to all staff!','ok');
}

  const overrides = CHECKIN_LOG.filter(l=>l.gpsOK===false).length;

    </div>
    <div class="g2" style="margin-bottom:20px">
      <div class="card">
        <div class="sec-title" style="margin-bottom:16px">Hours by staff member</div>
        ${staff.map(u=>{const h=getH(u.id);const pct=Math.min(100,Math.round(h/40*100));return`
          <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">

              <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px">
                <span style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${u.name.split(' ')[0]} ${u.name.split(' ').pop()}</span>

        </div>
      </div>

}

function saveSchoolInfo() {
  const schoolName = $('set-school-name').value.trim();
  const address = $('set-school-address').value.trim();
  const website = $('set-school-website').value.trim();
  const email = $('set-school-email').value.trim();
  
  if (!schoolName) { toast('School name is required.', 'err'); return; }
  SCHOOL.name = schoolName;
  SCHOOL.address = address;
  SCHOOL.website = website;
  SCHOOL.email = email;
  
  saveSchool();
  initSchoolName();
  toast('School information saved successfully!', 'ok');
}

function saveGpsSettings() {
  const lat = parseFloat($('set-gps-lat').value);
  const lng = parseFloat($('set-gps-lng').value);
  const radius = parseInt($('set-gps-radius').value);
  
  if (isNaN(lat) || isNaN(lng) || isNaN(radius)) { toast('All coordinates & radius must be valid numbers.', 'err'); return; }
  SCHOOL.lat = lat;
  SCHOOL.lng = lng;
  SCHOOL.radius = radius;
  
  saveSchool();
  toast('GPS Geofence configurations updated!', 'ok');
}

function saveSchedSettings() {
  const threshold = parseFloat($('set-ot-threshold').value);
  if (isNaN(threshold) || threshold <= 0) { toast('Overtime threshold must be a valid number.', 'err'); return; }
  
  const checkedBoxes = document.querySelectorAll('input[name="school-open-days"]:checked');
  const selectedDays = Array.from(checkedBoxes).map(cb => cb.value);
  
  if (selectedDays.length === 0) {
    toast('You must select at least one open day for the school.', 'err');
    return;
  }
  
  SCHOOL.otThreshold = threshold;
  SCHOOL.openDays = selectedDays;
  saveSchool();
  
  // Re-derive DAYS and FULL_DAYS
  DAYS = SCHOOL.openDays;
  FULL_DAYS = DAYS.map(d => WEEKDAY_NAMES[d]);
  
  // Roster schedule safety sync
  USERS.forEach(u => {
    if (u.role === 'principal_owner' || u.role === 'administrator' || u.role === 'office_manager' || u.role === 'office_assistant' || u.role === 'staff') {
      if (!SCHEDULE.shifts[u.id]) SCHEDULE.shifts[u.id] = {};
      DAYS.forEach(d => {
        if (!SCHEDULE.shifts[u.id][d]) {
          SCHEDULE.shifts[u.id][d] = { type: 'Off', start: null, end: null, location: 'Office', notes: '', ack: false };
        }
      });
    }
  });
  saveSchedule();
  
  toast('Scheduling & Open Days settings saved!', 'ok');
  pgSettings();
}

function renderSettingsSubjects() {
  const container = $('settings-subject-list');
  if (!container) return;
  container.innerHTML = SUBJECTS.map(sub => {
    const col = getSubjectColor(sub);
    return `<div style="display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--bdr-2);padding:6px 12px;border-radius:var(--r8);font-size:12px;font-weight:600;color:var(--tx)">
      <span style="width:8px;height:8px;border-radius:50%;background:${col}"></span>
      <span>${sub}</span>
      <span onclick="deleteSubjectFromSettings('${sub}')" style="cursor:pointer;color:var(--red);margin-left:4px;display:flex;align-items:center" title="Delete Subject"><i class="ti ti-x" style="font-size:13px"></i></span>
    </div>`;
  }).join('');
}

function addSubjectFromSettings() {
  const inp = $('new-subject-input');
  const val = inp?.value.trim();
  if (!val) { toast('Subject name cannot be empty.', 'err'); return; }
  if (SUBJECTS.includes(val)) { toast('Subject already exists.', 'err'); return; }
  
  SUBJECTS.push(val);
  saveSubjects();
  inp.value = '';
  renderSettingsSubjects();
  toast(`Subject "${val}" added successfully!`, 'ok');
}

function deleteSubjectFromSettings(sub) {
  if (SUBJECTS.length <= 1) {
    toast('You must have at least one academic subject.', 'err');
    return;
  }
  const assigned = USERS.filter(u => u.dept === sub && u.active);
  if (assigned.length > 0) {
    toast(`Cannot delete: ${assigned.length} staff member(s) are currently assigned to "${sub}".`, 'err');
    return;
  }
  SUBJECTS = SUBJECTS.filter(x => x !== sub);
  saveSubjects();
  renderSettingsSubjects();
  toast(`Subject "${sub}" removed.`, 'ok');
}

// Close sidebar when clicking outside on mobile
document.addEventListener('click', (e) => {
  const sidebar = $('sidebar');
  const toggleBtn = $('menu-toggle');
  if (sidebar && toggleBtn && window.innerWidth <= 768 && sidebar.classList.contains('open')) {
    if (!sidebar.contains(e.target) && !toggleBtn.contains(e.target)) {
      sidebar.classList.remove('open');
    }
  }
});

// Register Service Worker for PWA
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js')
      .then(reg => console.log('Service Worker registered', reg))
      .catch(err => console.error('Service Worker registration failed', err));
  });
}
