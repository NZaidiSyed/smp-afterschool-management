name: Security and branch isolation
on:
  pull_request:
  push:
    branches: [main, security/branch-isolation-staging]
permissions:
  contents: read
jobs:
  release_documentation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/release_guard.py validate --require-current
  production_approval:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    needs: [release_documentation, regressions]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/release_guard.py check-production
  regressions:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: smp_ci_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      SMP_TEST_POSTGRES_DSN: postgresql://postgres:synthetic-ci-only@127.0.0.1:5432/smp_ci_test
      SMP_DATA_DIR: /tmp/smp-ci-test-uat/data
      SMP_BACKUP_DIR: /tmp/smp-ci-test-uat/backups
      # Exercise the declared tzdata dependency, independent of runner OS data.
      PYTHONTZPATH: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
      - name: Select PostgreSQL 16 backup tools
        run: echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - name: Verify PostgreSQL backup tool versions
        run: |
          pg_dump --version
          pg_restore --version
          python - <<'PY'
          import subprocess
          for tool in ('pg_dump', 'pg_restore'):
              version = subprocess.check_output([tool, '--version'], text=True).split()[2]
              if version.split('.')[0] != '16':
                  raise SystemExit(f'{tool} must match the PostgreSQL 16 test service, got {version}')
          PY
      - run: python -m pip install -r requirements.txt
      - name: Run Python regressions
        run: python scripts/run_ci_tests.py
      - run: node scripts/test_service_worker.cjs
      - run: node scripts/test_camera_scanner.cjs
      - run: node scripts/test_trusted_messages.cjs
